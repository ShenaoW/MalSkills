[llm]
# MalSkills and every LLM-backed baseline reuse this runtime.
# For an OpenAI-compatible API, set mode = "api" and provide
# MALSKILLS_LLM_BASE_URL and MALSKILLS_LLM_API_KEY in the environment.

#mode = "codex_cli"
#model = "gpt-5.6-luna"
#reasoning_effort = "low"
#timeout_sec = 300

mode = "api"
model = "DeepSeek-V4-Flash-0731"
timeout_sec = 300
enable_thinking = false

[llm.sso_extraction]
enabled = true

[llm.object_analysis]
enabled = true

[llm.pattern_reasoning]
enabled = true

[llm.rule_feedback]
enabled = false
