# Ralphy 配置
# SkillGuard 项目的长期自动执行工作流

project:
  name: "SkillGuard"
  language: "Python"
  framework: "Neuro-symbolic 静态分析 CLI"
  description: "采用 evidence facts 提取、对象中心 primitive facts 编译与 Datalog 推理的恶意 Skill 分析器。"

commands:
  test: "pytest -q tests/test_extractors.py tests/test_intent.py tests/test_pipeline.py"
  lint: "python3 -m py_compile experiments/run_benchmark_study.py skillguard/*.py skillguard/static/*.py skillguard/intent/*.py skillguard/primitives/*.py skillguard/formal/*.py tests/*.py"
  build: "python3 -m skillguard.cli run-eval --benchmark experiments/benchmark_study/malicious_200_seed1337.json --output /tmp/skillguard_ralphy_eval --variant benchmark_full"

rules:
  - "把 PLANS.md 视为最高优先级路线图；任何架构、taxonomy、benchmark 目标变化都要先更新它。"
  - "仓库结构、命令入口或协作方式变化时，必须同步更新 AGENTS.md。"
  - "保持固定分析链：ingest -> evidence facts extraction -> object identity + primitive facts compilation -> Datalog reasoning -> reports。"
  - "目录组织按方法阶段划分，而不是按静态分析器或大模型引擎划分。"
  - "结构化检测必须沉淀到 rules/semgrep/，不要重新引入 legacy 手写 regex 扫描器。"
  - "Semgrep 与大模型共同构成 evidence fact extraction 阶段，输出必须保持同 schema。"
  - "YASA 与大模型共同构成 object identity analysis 阶段，输出必须保持同 schema。"
  - "YASA 只用于 Python/JavaScript/Go/Java 代码对象的深度参数/指针分析，属于 primitive compilation 阶段，其规则配置必须保留在 rules/yasa/。"
  - "模型新发现但静态未覆盖的高价值模式，应尽可能沉淀成新的静态规则，形成神经符号反馈。"
  - "所有新增检测都必须保留 provenance：artifact span -> evidence fact -> primitive fact -> pattern。"
  - "行为变化后必须补测试，优先落在 tests/test_extractors.py、tests/test_intent.py、tests/test_pipeline.py。"
  - "experiments/benchmark_study/malicious_200_heuristic_eval.json 是当前恶意召回率回归基线。"
  - "除非任务明确针对 YASA 集成，否则不要修改 vendored 的 skillguard/yasa 运行时。"
  - "本仓库目前不是 git worktree，默认采用顺序 PRD 执行，不优先使用 branch-per-task 或 parallel worktree。"

boundaries:
  never_touch:
    - "ralphy/**"
    - "skillguard/yasa/node_modules/**"
    - "skillguard/yasa/dist/**"
    - "paper/acmart.cls"
    - "paper/ACM-Reference-Format.bst"
    - "*.lock"
    - "package-lock.json"

notifications:
  discord_webhook: ""
  slack_webhook: ""
  custom_webhook: ""
