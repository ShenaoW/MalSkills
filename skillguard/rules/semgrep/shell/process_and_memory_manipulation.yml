rules:
  - id: shell.process_and_memory_manipulation.process_attach
    languages: [bash]
    message: Shell attaches to another process
    severity: WARNING
    metadata:
      skillguard_subtype: process_attach
      skillguard_evidence_type: process_and_memory_manipulation
    pattern-regex: '(?i)\b(gdb\s+-p|lldb\s+-p|strace\s+-p|ptrace)\b'

  - id: shell.process_and_memory_manipulation.cross_process_memory_read
    languages: [bash]
    message: Shell reads another process memory
    severity: WARNING
    metadata:
      skillguard_subtype: cross_process_memory_read
      skillguard_evidence_type: process_and_memory_manipulation
    pattern-regex: '(?i)/proc/[0-9]+/mem|gcore\b'

  - id: shell.process_and_memory_manipulation.cross_process_memory_write
    languages: [bash]
    message: Shell writes into another process memory
    severity: WARNING
    metadata:
      skillguard_subtype: cross_process_memory_write
      skillguard_evidence_type: process_and_memory_manipulation
    pattern-regex: '(?i)(gdb\b.*set\s+\{|\bdd\b.*\/proc\/[0-9]+\/mem)'

