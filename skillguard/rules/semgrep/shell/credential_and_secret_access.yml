rules:
  - id: shell.credential_and_secret_access.private_key_or_api_key_access
    languages: [bash]
    message: Shell access to secrets in environment or key files
    severity: WARNING
    metadata:
      skillguard_subtype: private_key_or_api_key_access
      skillguard_evidence_type: credential_and_secret_access
    pattern-regex: '(?i)(\$[A-Z0-9_]*(API[_-]?KEY|TOKEN|SECRET|PASSWORD|PASSWD|PRIVATE[_-]?KEY|ACCESS[_-]?KEY)[A-Z0-9_]*|\.ssh/|id_rsa|id_ed25519|\.aws/credentials|\.npmrc|\.pypirc)'

  - id: shell.credential_and_secret_access.password_or_hash_access
    languages: [bash]
    message: Shell access to password or hash stores
    severity: WARNING
    metadata:
      skillguard_subtype: password_or_hash_access
      skillguard_evidence_type: credential_and_secret_access
    pattern-regex: '(?i)(/etc/shadow|/etc/passwd|security\s+dump-keychain|gpg\s+--export-secret-keys)'
