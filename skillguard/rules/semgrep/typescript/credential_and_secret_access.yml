rules:
  - id: typescript.credential_and_secret_access.process_env_secret
    languages: [typescript]
    message: TypeScript access to secret-bearing environment variable
    severity: WARNING
    metadata:
      skillguard_subtype: private_key_or_api_key_access
      skillguard_evidence_type: credential_and_secret_access
      skillguard_value_metavar: $KEY
    patterns:
      - pattern-either:
          - pattern: process.env.$KEY
          - pattern: process.env[$KEY]
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(api[_-]?key|token|secret|passwd|password|private[_-]?key|access[_-]?key|session|cookie|credential).*
