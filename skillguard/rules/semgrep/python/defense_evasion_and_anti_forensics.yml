rules:
  - id: python.defense_evasion_and_anti_forensics.security_tool_impairment
    languages: [python]
    message: Python disables security tooling via CLI
    severity: WARNING
    metadata:
      skillguard_subtype: security_tool_impairment
      skillguard_evidence_type: defense_evasion_and_anti_forensics
      skillguard_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: subprocess.Popen($CMD, ...)
          - pattern: os.system($CMD)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(systemctl\s+stop|sc\s+stop|killall|taskkill).*(edr|defender|sentinel|falcon|crowdstrike|agent|audit).* 

  - id: python.defense_evasion_and_anti_forensics.audit_suppression
    languages: [python]
    message: Python suppresses logs or auditing
    severity: WARNING
    metadata:
      skillguard_subtype: logging_or_audit_suppression
      skillguard_evidence_type: defense_evasion_and_anti_forensics
      skillguard_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: os.system($CMD)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(wevtutil\s+cl|journalctl\s+--vacuum|auditctl\s+-e\s+0|rm\s+.*bash_history).* 

  - id: python.defense_evasion_and_anti_forensics.policy_weakening
    languages: [python]
    message: Python weakens system policy or access controls
    severity: WARNING
    metadata:
      skillguard_subtype: policy_or_access_control_weakening
      skillguard_evidence_type: defense_evasion_and_anti_forensics
      skillguard_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: os.system($CMD)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(ufw\s+disable|iptables\s+-F|setenforce\s+0|reg\s+add.*EnableLUA).*
