rules:
  - id: python.persistence_and_startup_control.scheduled_persistence_cli
    languages: [python]
    message: Python schedules cron or task-based persistence through CLI
    severity: WARNING
    metadata:
      skillguard_subtype: scheduled_persistence
      skillguard_evidence_type: persistence_and_startup_control
      skillguard_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: subprocess.Popen($CMD, ...)
          - pattern: os.system($CMD)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(crontab|schtasks|at\b|systemd-run).* 

  - id: python.persistence_and_startup_control.startup_persistence_write
    languages: [python]
    message: Python writes startup or logon persistence material
    severity: WARNING
    metadata:
      skillguard_subtype: startup_or_logon_persistence
      skillguard_evidence_type: persistence_and_startup_control
      skillguard_value_metavar: $PATH
    patterns:
      - pattern-either:
          - pattern: open($PATH, ...)
          - pattern: pathlib.Path($PATH).write_text(...)
          - pattern: pathlib.Path($PATH).write_bytes(...)
      - metavariable-regex:
          metavariable: $PATH
          regex: (?i).*(\.bashrc|\.profile|Startup|Run\\|RunOnce|LaunchAgents|autostart).* 

  - id: python.persistence_and_startup_control.service_persistence
    languages: [python]
    message: Python enables or creates service persistence
    severity: WARNING
    metadata:
      skillguard_subtype: service_or_daemon_persistence
      skillguard_evidence_type: persistence_and_startup_control
      skillguard_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: subprocess.Popen($CMD, ...)
          - pattern: os.system($CMD)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(systemctl\s+enable|sc\s+create|service\s+.*start|launchctl\s+load).*
