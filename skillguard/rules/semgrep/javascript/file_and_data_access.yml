rules:
  - id: javascript.file_and_data_access.file_enumeration
    languages: [javascript]
    message: JavaScript file or directory enumeration
    severity: WARNING
    metadata:
      skillguard_subtype: file_enumeration_and_location
      skillguard_evidence_type: file_and_data_access
      skillguard_value_metavar: $PATH
    pattern-either:
      - pattern: fs.readdirSync($PATH, ...)
      - pattern: fs.readdir($PATH, ...)
      - pattern: fs.promises.readdir($PATH, ...)
      - pattern: glob.sync($PATH, ...)

  - id: javascript.file_and_data_access.content_read
    languages: [javascript]
    message: JavaScript content read and parse from local files
    severity: WARNING
    metadata:
      skillguard_subtype: content_read_and_parse
      skillguard_evidence_type: file_and_data_access
      skillguard_value_metavar: $PATH
    pattern-either:
      - pattern: fs.readFileSync($PATH, ...)
      - pattern: fs.readFile($PATH, ...)
      - pattern: fs.promises.readFile($PATH, ...)

  - id: javascript.file_and_data_access.bulk_copy_archive
    languages: [javascript]
    message: JavaScript bulk copy or archive staging
    severity: WARNING
    metadata:
      skillguard_subtype: bulk_copy_and_archive
      skillguard_evidence_type: file_and_data_access
    pattern-either:
      - pattern: fs.cpSync(...)
      - pattern: fs.copyFileSync(...)
      - pattern: archiver(...)

  - id: javascript.file_and_data_access.config_modification
    languages: [javascript]
    message: JavaScript config or metadata modification
    severity: WARNING
    metadata:
      skillguard_subtype: config_or_metadata_modification
      skillguard_evidence_type: file_and_data_access
      skillguard_value_metavar: $PATH
    pattern-either:
      - pattern: fs.writeFileSync($PATH, ...)
      - pattern: fs.writeFile($PATH, ...)
      - pattern: fs.appendFileSync($PATH, ...)
      - pattern: fs.chmodSync($PATH, ...)
      - pattern: fs.utimesSync($PATH, ...)

  - id: javascript.file_and_data_access.deletion
    languages: [javascript]
    message: JavaScript deletion or overwrite
    severity: WARNING
    metadata:
      skillguard_subtype: deletion_or_overwrite
      skillguard_evidence_type: file_and_data_access
      skillguard_value_metavar: $PATH
    pattern-either:
      - pattern: fs.unlinkSync($PATH)
      - pattern: fs.rmSync($PATH, ...)
      - pattern: fs.rmdirSync($PATH, ...)
      - pattern: fs.truncateSync($PATH, ...)
