rules:
  - id: javascript.execution_control.child_process_shell
    languages: [javascript]
    message: JavaScript shell-backed command execution
    severity: WARNING
    metadata:
      skillguard_subtype: shell_interpreter_execution
      skillguard_evidence_type: execution_control
      skillguard_value_metavar: $CMD
    pattern-either:
      - pattern: exec($CMD, ...)
      - pattern: child_process.exec($CMD, ...)
      - pattern: execSync($CMD, ...)
      - pattern: child_process.execSync($CMD, ...)

  - id: javascript.execution_control.child_process_direct
    languages: [javascript]
    message: JavaScript direct process execution
    severity: WARNING
    metadata:
      skillguard_subtype: direct_process_execution
      skillguard_evidence_type: execution_control
      skillguard_value_metavar: $CMD
    pattern-either:
      - pattern: spawn($CMD, ...)
      - pattern: child_process.spawn($CMD, ...)
      - pattern: spawnSync($CMD, ...)
      - pattern: child_process.spawnSync($CMD, ...)
      - pattern: execFile($CMD, ...)
      - pattern: child_process.execFile($CMD, ...)
      - pattern: execFileSync($CMD, ...)
      - pattern: child_process.execFileSync($CMD, ...)

  - id: javascript.execution_control.script_host_execution
    languages: [javascript]
    message: JavaScript runtime code evaluation
    severity: WARNING
    metadata:
      skillguard_subtype: script_host_execution
      skillguard_evidence_type: execution_control
      skillguard_value_metavar: $CODE
    pattern-either:
      - pattern: eval($CODE)
      - pattern: new Function($CODE)

  - id: javascript.execution_control.dynamic_module_load
    languages: [javascript]
    message: JavaScript dynamic module loading
    severity: WARNING
    metadata:
      skillguard_subtype: dynamic_module_load
      skillguard_evidence_type: execution_control
      skillguard_value_metavar: $MODULE
    pattern-either:
      - pattern: require($MODULE)
      - pattern: import($MODULE)
      - pattern: process.dlopen($MODULE, ...)

  - id: javascript.execution_control.proxy_execution_or_lolbin
    languages: [javascript]
    message: JavaScript launches trusted proxy utility or LOLBin
    severity: WARNING
    metadata:
      skillguard_subtype: proxy_execution_or_lolbin_abuse
      skillguard_evidence_type: execution_control
      skillguard_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: child_process.exec($CMD, ...)
          - pattern: execSync($CMD, ...)
          - pattern: child_process.execSync($CMD, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(rundll32|regsvr32|mshta|wmic|powershell|bash\s+-c|sh\s+-c|curl\b.*\|\s*bash|wget\b.*\|\s*sh).*
