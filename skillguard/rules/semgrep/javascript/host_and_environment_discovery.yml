rules:
  - id: javascript.host_and_environment_discovery.system_info
    languages: [javascript]
    message: JavaScript system discovery
    severity: WARNING
    metadata:
      skillguard_subtype: system_and_hardware_discovery
      skillguard_evidence_type: host_and_environment_discovery
    pattern-either:
      - pattern: os.hostname()
      - pattern: os.release()
      - pattern: os.version()
      - pattern: os.arch()
      - pattern: os.platform()
      - pattern: os.cpus()
      - pattern: os.networkInterfaces()

  - id: javascript.host_and_environment_discovery.identity_discovery
    languages: [javascript]
    message: JavaScript identity discovery
    severity: WARNING
    metadata:
      skillguard_subtype: identity_and_account_discovery
      skillguard_evidence_type: host_and_environment_discovery
    pattern-either:
      - pattern: os.userInfo()
      - pattern: process.getuid()
      - pattern: process.geteuid()

  - id: javascript.host_and_environment_discovery.process_discovery
    languages: [javascript]
    message: JavaScript process and service discovery via third-party libs
    severity: WARNING
    metadata:
      skillguard_subtype: process_and_service_discovery
      skillguard_evidence_type: host_and_environment_discovery
    pattern-either:
      - pattern: systeminformation.processes(...)
      - pattern: process.kill($PID, 0)
