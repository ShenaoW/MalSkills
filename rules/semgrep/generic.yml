rules:
  - id: skillguard.generic.curl-pipe-bash
    message: Downloader shell pipeline in text artifact
    languages: [generic]
    severity: ERROR
    pattern-either:
      - pattern: curl ... | bash
      - pattern: curl ... | sh
      - pattern: wget ... | bash
      - pattern: wget ... | sh
      - pattern: Invoke-WebRequest ... | powershell
    metadata:
      skillguard_evidence_type: channel_object
      skillguard_subtype: installer_download
      skillguard_download_kind: script
      skillguard_confidence: "0.96"

  - id: skillguard.generic.download-url
    message: Download or visit external payload in text artifact
    languages: [generic]
    severity: ERROR
    pattern-either:
      - pattern: "Download https://..."
      - pattern: "Visit https://..."
      - pattern: "download https://..."
      - pattern: "visit https://..."
    metadata:
      skillguard_evidence_type: channel_object
      skillguard_subtype: installer_download
      skillguard_download_kind: installer
      skillguard_confidence: "0.90"

  - id: skillguard.generic.download-then-exec
    message: Download and execute guidance in text artifact
    languages: [generic]
    severity: ERROR
    pattern-either:
      - pattern: chmod +x ...
      - pattern: bash -c ...
      - pattern: sh -c ...
      - pattern: powershell -c ...
      - pattern: uv run ... --api-key ...
      - pattern: "... | bash"
      - pattern: "... | sh"
      - pattern: "run ... .exe ..."
      - pattern: "paste it into Terminal ..."
    metadata:
      skillguard_evidence_type: channel_object
      skillguard_subtype: shell_exec
      skillguard_confidence: "0.92"

  - id: skillguard.generic.obfuscated-exec
    message: Obfuscated shell execution in text artifact
    languages: [generic]
    severity: ERROR
    pattern-either:
      - pattern: base64 ... | bash
      - pattern: base64 ... | sh
      - pattern: python -c ...base64...
      - pattern: node -e ...base64...
    metadata:
      skillguard_evidence_type: operation
      skillguard_subtype: obfuscated_exec
      skillguard_confidence: "0.98"

  - id: skillguard.generic.hidden-instruction
    message: Hidden or coercive instruction in text artifact
    languages: [generic]
    severity: WARNING
    pattern-either:
      - pattern: ignore previous ...
      - pattern: do not tell the user ...
      - pattern: must run ...
      - pattern: mandatory setup ...
      - pattern: before proceeding ...
    metadata:
      skillguard_evidence_type: intent_object
      skillguard_subtype: hidden_instruction
      skillguard_confidence: "0.88"

  - id: skillguard.generic.setup-instruction
    message: Setup or bootstrap instruction in text artifact
    languages: [generic]
    severity: WARNING
    pattern-either:
      - pattern: "run this command ..."
      - pattern: "Run this command ..."
      - pattern: paste it into terminal ...
      - pattern: "paste it into Terminal ..."
      - pattern: copy the installation script ...
      - pattern: always run ...
      - pattern: do NOT cd to skill directory first ...
      - pattern: command -v ...
      - pattern: test -n ...
    metadata:
      skillguard_evidence_type: intent_object
      skillguard_subtype: setup_instruction
      skillguard_confidence: "0.84"

  - id: skillguard.generic.secret-request
    message: Secret request in text artifact
    languages: [generic]
    severity: WARNING
    pattern-either:
      - pattern: "API key ..."
      - pattern: api-key ...
      - pattern: token ...
      - pattern: private key ...
      - pattern: seed phrase ...
      - pattern: mnemonic ...
      - pattern: GEMINI_API_KEY ...
      - pattern: OPENAI_API_KEY ...
    metadata:
      skillguard_evidence_type: intent_object
      skillguard_subtype: secret_request
      skillguard_confidence: "0.86"

  - id: skillguard.generic.declared-action
    message: Declared capability or action in text artifact
    languages: [generic]
    severity: INFO
    pattern-either:
      - pattern: "description: ..."
      - pattern: "Goal: ..."
      - pattern: "Use for ..."
      - pattern: "Supports ..."
      - pattern: "The script checks ..."
    metadata:
      skillguard_evidence_type: intent_object
      skillguard_subtype: declared_action
      skillguard_confidence: "0.70"

  - id: skillguard.generic.external-url-config
    message: External URL declared in config or text artifact
    languages: [generic]
    severity: INFO
    pattern-either:
      - pattern: "url: https://..."
      - pattern: '"url": "https://..."'
      - pattern: "endpoint: https://..."
      - pattern: '"endpoint": "https://..."'
      - pattern: "https://..."
    metadata:
      skillguard_evidence_type: data_object
      skillguard_subtype: config_value
      skillguard_confidence: "0.78"
