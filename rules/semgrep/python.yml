rules:
  - id: skillguard.python.env-read
    message: Python environment variable access
    languages: [python]
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: os.getenv($KEY)
          - pattern: os.environ[$KEY]
    metadata:
      skillguard_evidence_type: data_object
      skillguard_subtype: env_read
      skillguard_value_metavar: $KEY

  - id: skillguard.python.file-read
    message: Python file read
    languages: [python]
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: open($PATH, ...)
          - pattern: pathlib.Path($PATH).read_text(...)
          - pattern: pathlib.Path($PATH).read_bytes(...)
          - pattern: Path($PATH).read_text(...)
          - pattern: Path($PATH).read_bytes(...)
    metadata:
      skillguard_evidence_type: data_object
      skillguard_subtype: file_read
      skillguard_value_metavar: $PATH

  - id: skillguard.python.list-dir
    message: Python directory listing
    languages: [python]
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: os.listdir($PATH)
          - pattern: glob.glob($PATH)
    metadata:
      skillguard_evidence_type: operation
      skillguard_subtype: list_dir
      skillguard_value_metavar: $PATH

  - id: skillguard.python.network-send
    message: Python network send
    languages: [python]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: requests.post($URL, ...)
          - pattern: requests.put($URL, ...)
          - pattern: requests.patch($URL, ...)
          - pattern: requests.delete($URL, ...)
          - pattern: httpx.post($URL, ...)
          - pattern: httpx.put($URL, ...)
          - pattern: httpx.patch($URL, ...)
          - pattern: httpx.delete($URL, ...)
    metadata:
      skillguard_evidence_type: channel_object
      skillguard_subtype: network_send
      skillguard_value_metavar: $URL

  - id: skillguard.python.network-fetch
    message: Python network fetch
    languages: [python]
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: requests.get($URL, ...)
          - pattern: httpx.get($URL, ...)
          - pattern: urllib.request.urlopen($URL, ...)
          - pattern: urlopen($URL, ...)
    metadata:
      skillguard_evidence_type: channel_object
      skillguard_subtype: network_fetch
      skillguard_value_metavar: $URL

  - id: skillguard.python.shell-exec
    message: Python shell execution
    languages: [python]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: subprocess.Popen($CMD, ...)
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD)
          - pattern: eval($CMD)
          - pattern: exec($CMD)
    metadata:
      skillguard_evidence_type: channel_object
      skillguard_subtype: shell_exec
      skillguard_value_metavar: $CMD

  - id: skillguard.python.dynamic-load
    message: Python dynamic module load
    languages: [python]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: importlib.import_module($MOD)
          - pattern: __import__($MOD)
    metadata:
      skillguard_evidence_type: channel_object
      skillguard_subtype: dynamic_load
      skillguard_value_metavar: $MOD

  - id: skillguard.python.config-ref
    message: Python config object reference
    languages: [python]
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: cfg[$KEY]
          - pattern: config[$KEY]
          - pattern: settings[$KEY]
          - pattern: cfg.get($KEY, ...)
          - pattern: config.get($KEY, ...)
          - pattern: settings.get($KEY, ...)
    metadata:
      skillguard_evidence_type: reference
      skillguard_subtype: config_ref
      skillguard_value_metavar: $KEY
      skillguard_confidence: "0.82"
