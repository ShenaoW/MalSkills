rules:
  - id: shared.third_party_wrappers.python_fabric_shell_exec
    languages: [python]
    message: Third-party Python wrapper executes shell command
    severity: WARNING
    metadata:
      malskills_subtype: shell_interpreter_execution
      malskills_sso_category: execution_control
      malskills_value_metavar: $CMD
    pattern-either:
      - pattern: fabric.Connection(...).run($CMD, ...)
      - pattern: invoke.run($CMD, ...)
      - pattern: pexpect.run($CMD, ...)

  - id: shared.third_party_wrappers.javascript_exec
    languages: [javascript, typescript]
    message: Third-party JavaScript wrapper executes shell command
    severity: WARNING
    metadata:
      malskills_subtype: shell_interpreter_execution
      malskills_sso_category: execution_control
      malskills_value_metavar: $CMD
    pattern-either:
      - pattern: execa($CMD, ...)
      - pattern: execaCommand($CMD, ...)
      - pattern: shell.exec($CMD, ...)

  - id: shared.third_party_wrappers.javascript_network
    languages: [javascript, typescript]
    message: Third-party JavaScript wrapper initiates outbound communication
    severity: WARNING
    metadata:
      malskills_subtype: outbound_connection
      malskills_sso_category: network_and_remote_communication
      malskills_value_metavar: $URL
    pattern-either:
      - pattern: superagent.get($URL, ...)
      - pattern: superagent.post($URL, ...)
      - pattern: needle.get($URL, ...)
      - pattern: needle.post($URL, ...)
      - pattern: unirest.get($URL, ...)
      - pattern: unirest.post($URL, ...)
