rules:
  - id: python.execution_control.subprocess_shell_interpreter_execution
    languages: [python]
    message: Python shell-backed process execution
    severity: WARNING
    metadata:
      malskills_subtype: shell_interpreter_execution
      malskills_evidence_type: execution_control
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, shell=True, ...)
          - pattern: subprocess.Popen($CMD, shell=True, ...)
          - pattern: subprocess.call($CMD, shell=True, ...)
          - pattern: subprocess.check_call($CMD, shell=True, ...)
          - pattern: subprocess.check_output($CMD, shell=True, ...)

  - id: python.execution_control.os_shell_interpreter_execution
    languages: [python]
    message: Python shell interpreter execution via os/system APIs
    severity: WARNING
    metadata:
      malskills_subtype: shell_interpreter_execution
      malskills_evidence_type: execution_control
      malskills_value_metavar: $CMD
    pattern-either:
      - pattern: os.system($CMD)
      - pattern: os.popen($CMD)
      - pattern: popen($CMD)

  - id: python.execution_control.subprocess_direct_process_execution
    languages: [python]
    message: Python direct process execution
    severity: WARNING
    metadata:
      malskills_subtype: direct_process_execution
      malskills_evidence_type: execution_control
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: subprocess.Popen($CMD, ...)
          - pattern: subprocess.call($CMD, ...)
          - pattern: subprocess.check_call($CMD, ...)
          - pattern: subprocess.check_output($CMD, ...)
      - pattern-not: subprocess.run($CMD, shell=True, ...)
      - pattern-not: subprocess.Popen($CMD, shell=True, ...)
      - pattern-not: subprocess.call($CMD, shell=True, ...)
      - pattern-not: subprocess.check_call($CMD, shell=True, ...)
      - pattern-not: subprocess.check_output($CMD, shell=True, ...)

  - id: python.execution_control.script_host_execution
    languages: [python]
    message: Python dynamic code execution in host interpreter
    severity: WARNING
    metadata:
      malskills_subtype: script_host_execution
      malskills_evidence_type: execution_control
      malskills_value_metavar: $CODE
    pattern-either:
      - pattern: eval($CODE)
      - pattern: exec($CODE)
      - pattern: compile($CODE, ...)

  - id: python.execution_control.dynamic_module_load_importlib
    languages: [python]
    message: Python dynamic module loading via importlib
    severity: WARNING
    metadata:
      malskills_subtype: dynamic_module_load
      malskills_evidence_type: execution_control
      malskills_value_metavar: $MODULE
    pattern-either:
      - pattern: importlib.import_module($MODULE)
      - pattern: __import__($MODULE)

  - id: python.execution_control.dynamic_module_load_ctypes
    languages: [python]
    message: Python dynamic library loading via ctypes
    severity: WARNING
    metadata:
      malskills_subtype: dynamic_module_load
      malskills_evidence_type: execution_control
      malskills_value_metavar: $MODULE
    pattern-either:
      - pattern: ctypes.CDLL($MODULE)
      - pattern: ctypes.PyDLL($MODULE)
      - pattern: ctypes.WinDLL($MODULE)
      - pattern: ctypes.cdll.LoadLibrary($MODULE)

  - id: python.execution_control.lolbin_proxy_execution
    languages: [python]
    message: Python launches LOLBin or trusted proxy utility
    severity: WARNING
    metadata:
      malskills_subtype: proxy_execution_or_lolbin_abuse
      malskills_evidence_type: execution_control
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: subprocess.Popen($CMD, ...)
          - pattern: os.system($CMD)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(rundll32|regsvr32|mshta|wmic|powershell|bash\s+-c|sh\s+-c|curl\b.*\|\s*bash|wget\b.*\|\s*sh).*
