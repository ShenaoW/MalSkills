rules:
  - id: python.impact_and_destruction.data_destruction
    languages: [python]
    message: Python performs destructive deletion or wipe activity
    severity: WARNING
    metadata:
      malskills_subtype: data_destruction
      malskills_evidence_type: impact_and_destruction
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: shutil.rmtree(...)
          - pattern: os.remove(...)
          - pattern: os.unlink(...)
          - pattern: pathlib.Path(...).unlink(...)
          - pattern: subprocess.run($CMD, ...)
          - pattern: os.system($CMD)
      - pattern-not: shutil.rmtree(..., ignore_errors=True)

  - id: python.impact_and_destruction.data_encryption_or_locking
    languages: [python]
    message: Python encrypts local data or files
    severity: WARNING
    metadata:
      malskills_subtype: data_encryption_or_locking
      malskills_evidence_type: impact_and_destruction
    pattern-either:
      - pattern: Fernet(...).encrypt(...)
      - pattern: AES.new(...).encrypt(...)
      - pattern: rsa.encrypt(...)

  - id: python.impact_and_destruction.recovery_impairment
    languages: [python]
    message: Python deletes backups, snapshots, or recovery paths
    severity: WARNING
    metadata:
      malskills_subtype: recovery_impairment
      malskills_evidence_type: impact_and_destruction
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: os.system($CMD)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(vssadmin\s+delete\s+shadows|wbadmin\s+delete|rm\s+-rf\s+.*backup).*

  - id: python.impact_and_destruction.availability_disruption
    languages: [python]
    message: Python shuts down systems or disrupts availability
    severity: WARNING
    metadata:
      malskills_subtype: availability_disruption
      malskills_evidence_type: impact_and_destruction
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ...)
          - pattern: os.system($CMD)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(shutdown|reboot|halt|poweroff|kill\s+-9).*

