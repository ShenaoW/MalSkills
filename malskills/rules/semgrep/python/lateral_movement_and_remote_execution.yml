rules:
  - id: python.lateral_movement_and_remote_execution.remote_login
    languages: [python]
    message: Python authenticates to a remote host or service
    severity: WARNING
    metadata:
      malskills_subtype: remote_login
      malskills_sso_category: lateral_movement_and_remote_execution
    pattern-either:
      - pattern: paramiko.SSHClient().connect(...)
      - pattern: winrm.Session(...)

  - id: python.lateral_movement_and_remote_execution.remote_command_execution
    languages: [python]
    message: Python executes commands on a remote host
    severity: WARNING
    metadata:
      malskills_subtype: remote_command_execution
      malskills_sso_category: lateral_movement_and_remote_execution
    pattern-either:
      - pattern: paramiko.SSHClient().exec_command(...)
      - pattern: winrm.Session(...).run_cmd(...)
      - pattern: winrm.Session(...).run_ps(...)

  - id: python.lateral_movement_and_remote_execution.remote_file_transfer
    languages: [python]
    message: Python transfers files to or from a remote host
    severity: WARNING
    metadata:
      malskills_subtype: remote_file_transfer
      malskills_sso_category: lateral_movement_and_remote_execution
    pattern-either:
      - pattern: paramiko.SFTPClient.from_transport(...).put(...)
      - pattern: paramiko.SFTPClient.from_transport(...).get(...)
      - pattern: SCPClient(...).put(...)
      - pattern: SCPClient(...).get(...)

  - id: python.lateral_movement_and_remote_execution.cluster_or_cloud_node_control
    languages: [python]
    message: Python controls remote cluster or cloud nodes
    severity: WARNING
    metadata:
      malskills_subtype: cluster_or_cloud_node_control
      malskills_sso_category: lateral_movement_and_remote_execution
    pattern-either:
      - pattern: kubernetes.stream.stream(...)
      - pattern: boto3.client("ssm").send_command(...)
      - pattern: docker.from_env().containers.run(...)

