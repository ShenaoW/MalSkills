rules:
  - id: python.credential_and_secret_access.env_secret_access
    languages: [python]
    message: Python access to secret-bearing environment variable
    severity: WARNING
    metadata:
      malskills_subtype: private_key_or_api_key_access
      malskills_evidence_type: credential_and_secret_access
      malskills_value_metavar: $KEY
    patterns:
      - pattern-either:
          - pattern: os.getenv($KEY)
          - pattern: os.environ[$KEY]
          - pattern: os.environ.get($KEY)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(api[_-]?key|token|secret|passwd|password|private[_-]?key|access[_-]?key|session|cookie|credential).* 

  - id: python.credential_and_secret_access.keyring_password_access
    languages: [python]
    message: Python access to system-stored credentials
    severity: WARNING
    metadata:
      malskills_subtype: password_or_hash_access
      malskills_evidence_type: credential_and_secret_access
    pattern-either:
      - pattern: keyring.get_password(...)
      - pattern: keyring.get_credential(...)

  - id: python.credential_and_secret_access.credential_decryption
    languages: [python]
    message: Python decrypts or unwraps local credential material
    severity: WARNING
    metadata:
      malskills_subtype: credential_decryption
      malskills_evidence_type: credential_and_secret_access
    pattern-either:
      - pattern: win32crypt.CryptUnprotectData(...)
      - pattern: Fernet($KEY).decrypt(...)

  - id: python.credential_and_secret_access.sensitive_file_access
    languages: [python]
    message: Python accesses sensitive credential-bearing files
    severity: WARNING
    metadata:
      malskills_subtype: private_key_or_api_key_access
      malskills_evidence_type: credential_and_secret_access
      malskills_value_metavar: $PATH
    patterns:
      - pattern-either:
          - pattern: open($PATH, ...)
          - pattern: pathlib.Path($PATH).read_text(...)
          - pattern: pathlib.Path($PATH).read_bytes(...)
      - metavariable-regex:
          metavariable: $PATH
          regex: (?i).*(\.ssh|id_rsa|id_ed25519|known_hosts|/etc/shadow|/etc/passwd|\.aws/credentials|\.npmrc|\.pypirc|keychain|cookies|tokens?).*
