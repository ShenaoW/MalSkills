rules:
  - id: python.process_and_memory_manipulation.process_attach
    languages: [python]
    message: Python attaches to or debugs another process
    severity: WARNING
    metadata:
      malskills_subtype: process_attach
      malskills_sso_category: process_and_memory_manipulation
    pattern-either:
      - pattern: ptrace.attach(...)
      - pattern: ptrace.debugger.PtraceDebugger().addProcess(...)
      - pattern: gdb.attach(...)

  - id: python.process_and_memory_manipulation.cross_process_memory_read
    languages: [python]
    message: Python reads memory from another process
    severity: WARNING
    metadata:
      malskills_subtype: cross_process_memory_read
      malskills_sso_category: process_and_memory_manipulation
    pattern-either:
      - pattern: process.read_bytes(...)
      - pattern: pymem.Pymem(...).read_bytes(...)
      - pattern: open("/proc/" + ... + "/mem", ...)

  - id: python.process_and_memory_manipulation.cross_process_memory_write
    languages: [python]
    message: Python writes into another process memory
    severity: WARNING
    metadata:
      malskills_subtype: cross_process_memory_write
      malskills_sso_category: process_and_memory_manipulation
    pattern-either:
      - pattern: pymem.Pymem(...).write_bytes(...)
      - pattern: process.write_bytes(...)

  - id: python.process_and_memory_manipulation.executable_memory_mapping
    languages: [python]
    message: Python creates executable memory mappings
    severity: WARNING
    metadata:
      malskills_subtype: executable_memory_mapping
      malskills_sso_category: process_and_memory_manipulation
    pattern-either:
      - pattern: mmap.mmap(..., prot=mmap.PROT_EXEC, ...)
      - pattern: mmap.mmap(..., access=mmap.ACCESS_WRITE, ...)

