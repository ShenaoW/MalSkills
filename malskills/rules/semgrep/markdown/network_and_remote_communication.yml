rules:
  - id: markdown.network_and_remote_communication.fetch_command
    languages: [generic]
    paths:
      include:
        - '*.md'
        - '*.markdown'
        - 'README*'
        - 'SKILL.md'
    message: Markdown contains an explicit remote-data receive command
    severity: WARNING
    metadata:
      malskills_subtype: data_receive
      malskills_sso_category: network_access
    pattern-regex: '(?im)^\s*(?:>\s*)*(?:[-*]\s+|\d+\.\s+)?(?:`{1,3})?(?:sudo\s+)?(?:curl|wget|Invoke-WebRequest|iwr|openssl\s+s_client)\b[^\n]*https?://'

  - id: markdown.network_and_remote_communication.imperative_script_or_archive_download
    languages: [generic]
    paths:
      include:
        - '*.md'
        - '*.markdown'
        - 'README*'
        - 'SKILL.md'
    message: Markdown instructs the user to download an external script or archive
    severity: WARNING
    metadata:
      malskills_subtype: data_receive
      malskills_sso_category: network_access
    pattern-regex: '(?im)^\s*(?:>\s*)*(?:[-*]\s+|\d+\.\s+)?[^\n]*\b(?:download|fetch|get)\b[^\n]*\[[^]\n]+\]\(https?://[^)\s]+\)'

  - id: markdown.network_and_remote_communication.dns_command
    languages: [generic]
    paths:
      include:
        - '*.md'
        - '*.markdown'
        - 'README*'
        - 'SKILL.md'
    message: Markdown contains an explicit DNS resolution command
    severity: WARNING
    metadata:
      malskills_subtype: dns_resolution
      malskills_sso_category: network_access
    pattern-regex: '(?im)^\s*(?:[-*]\s+|\d+\.\s+)?(?:`{1,3})?(?:dig|nslookup)\s+\S+'

  - id: markdown.network_and_remote_communication.connection_command
    languages: [generic]
    paths:
      include:
        - '*.md'
        - '*.markdown'
        - 'README*'
        - 'SKILL.md'
    message: Markdown contains an explicit remote connection command
    severity: WARNING
    metadata:
      malskills_subtype: connection_create
      malskills_sso_category: network_access
    pattern-regex: '(?im)^\s*(?:[-*]\s+|\d+\.\s+)?(?:`{1,3})?(?:sudo\s+)?(?:nc|ncat|socat|ssh)\b[^\n]+'
