rules:
  - id: markdown.network_and_remote_communication.fetch_command
    languages: [generic]
    paths:
      include:
        - '*.md'
        - '*.markdown'
        - 'README*'
        - 'SKILL.md'
    message: Markdown contains an explicit outbound fetch command
    severity: WARNING
    metadata:
      malskills_subtype: outbound_connection
      malskills_sso_category: network_and_remote_communication
    pattern-regex: '(?im)^\s*(?:[-*]\s+|\d+\.\s+)?(?:`{1,3})?(?:sudo\s+)?(?:curl|wget|Invoke-WebRequest|iwr|openssl\s+s_client)\b[^\n]*https?://'

  - id: markdown.network_and_remote_communication.script_or_archive_link
    languages: [generic]
    paths:
      include:
        - '*.md'
        - '*.markdown'
        - 'README*'
        - 'SKILL.md'
    message: Markdown contains a structured external script or executable archive link
    severity: WARNING
    metadata:
      malskills_subtype: outbound_connection
      malskills_sso_category: network_and_remote_communication
    pattern-regex: '(?i)\[[^]\n]+\]\((https?://[^)\s]+(\.sh|\.ps1|\.bat|\.exe|\.msi|\.pkg|\.dmg|\.zip|\.tar|\.tgz|/raw/[^)\s]*|raw\.githubusercontent\.com[^)\s]*))\)'

  - id: markdown.network_and_remote_communication.socket_or_dns_command
    languages: [generic]
    paths:
      include:
        - '*.md'
        - '*.markdown'
        - 'README*'
        - 'SKILL.md'
    message: Markdown contains an explicit socket or DNS communication command
    severity: WARNING
    metadata:
      malskills_subtype: outbound_connection
      malskills_sso_category: network_and_remote_communication
    pattern-regex: '(?im)^\s*(?:[-*]\s+|\d+\.\s+)?(?:`{1,3})?(?:sudo\s+)?(?:dig\s+\S+|nslookup\s+\S+|ncat?\s+(?:-l\s+)?\S+(?:\s+\d+)?|socat\s+\S+:\S+,\S+|ssh\s+(?:-\S+\s+)*(?:\S+@\S+|\S+))\b'
