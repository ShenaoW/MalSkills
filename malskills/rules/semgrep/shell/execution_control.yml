rules:
  - id: shell.execution_control.shell_interpreter_execution
    languages: [bash]
    message: Shell interpreter execution or remote shell bootstrap
    severity: WARNING
    metadata:
      malskills_subtype: system_command_execution
      malskills_sso_category: payload_execution
    pattern-regex: '(?im)\b(bash|sh|zsh)\s+-c\b|\beval\b|(?:^|[|;&]{1,2}\s*)source\s+|^\s*\.\s+'

  - id: shell.execution_control.script_host_execution
    languages: [bash]
    message: Shell launches interpreter-hosted inline code
    severity: WARNING
    metadata:
      malskills_subtype: dynamic_code_execution
      malskills_sso_category: payload_execution
    pattern-regex: '(?i)\b(python|python3|node|perl|ruby|php|powershell)\s+(-c|-e|-enc|-Command)\b'

  - id: shell.execution_control.proxy_execution_or_lolbin_abuse
    languages: [bash]
    message: Shell launches LOLBin or trusted proxy utility
    severity: WARNING
    metadata:
      malskills_subtype: system_command_execution
      malskills_sso_category: payload_execution
    pattern-regex: '(?i)\b(rundll32|regsvr32|mshta|wmic|osascript|powershell)\b|\b(curl|wget)\b.*\|\s*(bash|sh)\b'

  - id: shell.execution_control.dynamic_module_load
    languages: [bash]
    message: Shell dynamic module or shared library loading hints
    severity: WARNING
    metadata:
      malskills_subtype: dynamic_code_execution
      malskills_sso_category: payload_execution
    pattern-regex: '(?i)\b(dlopen|LD_PRELOAD=|python\s+-c\s+.*ctypes\.CDLL)'
