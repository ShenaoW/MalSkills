rules:
  - id: shell.network_and_remote_communication.outbound_connection
    languages: [bash]
    message: Shell outbound connection or remote fetch
    severity: WARNING
    metadata:
      malskills_subtype: outbound_connection
      malskills_evidence_type: network_and_remote_communication
    pattern-regex: '(?i)\b(curl|wget|nc|ncat|openssl\s+s_client|ssh)\b'

  - id: shell.network_and_remote_communication.listener
    languages: [bash]
    message: Shell listener or inbound receive channel
    severity: WARNING
    metadata:
      malskills_subtype: listener_and_receive
      malskills_evidence_type: network_and_remote_communication
    pattern-regex: '(?i)\b(nc|ncat|socat)\b.*\s(-l|--listen)\b'

  - id: shell.network_and_remote_communication.tunneling
    languages: [bash]
    message: Shell tunneling or forwarding
    severity: WARNING
    metadata:
      malskills_subtype: tunneling_and_forwarding
      malskills_evidence_type: network_and_remote_communication
    pattern-regex: '(?i)\bssh\b.*\s(-L|-R|-D)\b|\bsshuttle\b|\bsocat\b'

  - id: shell.network_and_remote_communication.encrypted_comm
    languages: [bash]
    message: Shell encrypted or encapsulated communication
    severity: WARNING
    metadata:
      malskills_subtype: protocol_encapsulation_or_encrypted_comm
      malskills_evidence_type: network_and_remote_communication
    pattern-regex: >-
      (?im)^(?!\s*#)\s*((curl|wget)\b[^\n#]*https://[^\s"'`]+|\bdig\b[^\n#]*|\bopenssl\s+s_client\b[^\n#]*)|(?:^|[|;&]{1,2}\s*)((curl|wget)\b[^\n#]*https://[^\s"'`]+|\bdig\b[^\n#]*|\bopenssl\s+s_client\b[^\n#]*)

  - id: shell.network_and_remote_communication.traffic_capture
    languages: [bash]
    message: Shell traffic capture and observation
    severity: WARNING
    metadata:
      malskills_subtype: traffic_capture_and_observation
      malskills_evidence_type: network_and_remote_communication
    pattern-regex: '(?i)\b(tcpdump|tshark|ngrep|wireshark)\b'
