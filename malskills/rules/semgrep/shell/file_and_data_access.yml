rules:
  - id: shell.file_and_data_access.file_enumeration_and_location
    languages: [bash]
    message: Shell enumerates files or directories
    severity: WARNING
    metadata:
      malskills_subtype: file_search
      malskills_sso_category: file_operation
    pattern-regex: '(?im)^(?!\s*#)\s*(find\b\s+[^#\n]+|locate\b\s+[^#\n]+|fd\b(?:\s+[^#\n]+)?|grep\s+-R\b\s+[^#\n]+|ls(?:\s+-[A-Za-z]+)*(?:\s+[^#\n]+)?)|(?:^|[|;&]{1,2}\s*)(find\b\s+[^#\n]+|locate\b\s+[^#\n]+|fd\b(?:\s+[^#\n]+)?|grep\s+-R\b\s+[^#\n]+|ls(?:\s+-[A-Za-z]+)*(?:\s+[^#\n]+)?)'

  - id: shell.file_and_data_access.content_read_and_parse
    languages: [bash]
    message: Shell reads file, config, or database contents
    severity: WARNING
    metadata:
      malskills_subtype: file_read
      malskills_sso_category: file_operation
    pattern-regex: '(?i)\b(cat|less|head|tail|sqlite3|jq)\b'

  - id: shell.file_and_data_access.bulk_copy_and_archive
    languages: [bash]
    message: Shell copies or archives data in bulk
    severity: WARNING
    metadata:
      malskills_subtype: file_write
      malskills_sso_category: file_operation
    pattern-regex: '(?i)\b(cp|rsync|tar|zip|7z)\b'

  - id: shell.file_and_data_access.file_write_or_timestamp_modify
    languages: [bash]
    message: Shell modifies file content or timestamps
    severity: WARNING
    metadata:
      malskills_subtype: file_write
      malskills_sso_category: file_operation
    pattern-regex: '(?i)\b(sed\s+-i|touch\s+-t)\b'

  - id: shell.file_and_data_access.permission_modify
    languages: [bash]
    message: Shell modifies file ownership or permissions
    severity: WARNING
    metadata:
      malskills_subtype: file_permission_modify
      malskills_sso_category: file_operation
    pattern-regex: '(?i)\b(chmod|chown|chgrp|setfacl)\b'

  - id: shell.file_and_data_access.deletion_or_overwrite
    languages: [bash]
    message: Shell deletes or overwrites data
    severity: WARNING
    metadata:
      malskills_subtype: file_delete
      malskills_sso_category: file_operation
    pattern-regex: '(?i)\b(rm|truncate|shred)\b'
