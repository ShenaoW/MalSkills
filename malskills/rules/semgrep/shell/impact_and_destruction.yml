rules:
  - id: shell.impact_and_destruction.data_destruction
    languages: [bash]
    message: Shell destroys or wipes data
    severity: WARNING
    metadata:
      malskills_subtype: data_destruction
      malskills_sso_category: impact_and_destruction
    pattern-regex: '(?i)\b(rm\s+-rf|shred|dd\s+if=\/dev\/zero)\b'

  - id: shell.impact_and_destruction.data_encryption_or_locking
    languages: [bash]
    message: Shell encrypts or locks local data
    severity: WARNING
    metadata:
      malskills_subtype: data_encryption_or_locking
      malskills_sso_category: impact_and_destruction
    pattern-regex: '(?i)\b(openssl\s+enc|gpg\s+-c|gpg\s+--symmetric)\b'

  - id: shell.impact_and_destruction.recovery_impairment
    languages: [bash]
    message: Shell removes backups or recovery paths
    severity: WARNING
    metadata:
      malskills_subtype: recovery_impairment
      malskills_sso_category: impact_and_destruction
    pattern-regex: '(?i)\b(vssadmin\s+delete\s+shadows|wbadmin\s+delete|rm\s+-rf\s+.*backup)\b'

  - id: shell.impact_and_destruction.availability_disruption
    languages: [bash]
    message: Shell disrupts host or service availability
    severity: WARNING
    metadata:
      malskills_subtype: availability_disruption
      malskills_sso_category: impact_and_destruction
    pattern-regex: '(?i)\b(shutdown|reboot|halt|poweroff|kill\s+-9)\b'

