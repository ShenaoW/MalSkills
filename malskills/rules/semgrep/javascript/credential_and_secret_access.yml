rules:
  - id: javascript.credential_and_secret_access.process_env_secret
    languages: [javascript]
    message: JavaScript access to secret-bearing environment variable
    severity: WARNING
    metadata:
      malskills_subtype: private_key_or_api_key_access
      malskills_sso_category: credential_and_secret_access
      malskills_value_metavar: $KEY
    patterns:
      - pattern-either:
          - pattern: process.env.$KEY
          - pattern: process.env[$KEY]
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(api[_-]?key|token|secret|passwd|password|private[_-]?key|access[_-]?key|session|cookie|credential).* 

  - id: javascript.credential_and_secret_access.sensitive_file_reads
    languages: [javascript]
    message: JavaScript reads sensitive credential-bearing files
    severity: WARNING
    metadata:
      malskills_subtype: private_key_or_api_key_access
      malskills_sso_category: credential_and_secret_access
      malskills_value_metavar: $PATH
    patterns:
      - pattern-either:
          - pattern: fs.readFileSync($PATH, ...)
          - pattern: fs.readFile($PATH, ...)
          - pattern: fs.promises.readFile($PATH, ...)
      - metavariable-regex:
          metavariable: $PATH
          regex: (?i).*(\.ssh|id_rsa|id_ed25519|/etc/shadow|\.aws/credentials|\.npmrc|cookies|token|secret).*
