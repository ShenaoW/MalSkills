rules:
  - id: javascript.lateral_movement_and_remote_execution.remote_login
    languages: [javascript]
    message: JavaScript authenticates to a remote host or environment
    severity: WARNING
    metadata:
      malskills_subtype: remote_login
      malskills_evidence_type: lateral_movement_and_remote_execution
    pattern-either:
      - pattern: new Client().connect(...)
      - pattern: ssh2.connect(...)

  - id: javascript.lateral_movement_and_remote_execution.remote_command_execution
    languages: [javascript]
    message: JavaScript executes commands on a remote host
    severity: WARNING
    metadata:
      malskills_subtype: remote_command_execution
      malskills_evidence_type: lateral_movement_and_remote_execution
    pattern-either:
      - pattern: $CLIENT.exec(...)
      - pattern: ssh.execCommand(...)

  - id: javascript.lateral_movement_and_remote_execution.remote_file_transfer
    languages: [javascript]
    message: JavaScript transfers files across hosts
    severity: WARNING
    metadata:
      malskills_subtype: remote_file_transfer
      malskills_evidence_type: lateral_movement_and_remote_execution
    pattern-either:
      - pattern: scp2.scp(...)
      - pattern: sftp.fastPut(...)
      - pattern: sftp.fastGet(...)

  - id: javascript.lateral_movement_and_remote_execution.cluster_or_cloud_node_control
    languages: [javascript]
    message: JavaScript controls cluster or cloud nodes
    severity: WARNING
    metadata:
      malskills_subtype: cluster_or_cloud_node_control
      malskills_evidence_type: lateral_movement_and_remote_execution
    pattern-either:
      - pattern: k8sExec.exec(...)
      - pattern: new AWS.SSM().sendCommand(...)
      - pattern: docker.run(...)

