rules:
  - id: javascript.defense_evasion_and_anti_forensics.security_tool_impairment
    languages: [javascript]
    message: JavaScript disables security tooling through child_process
    severity: WARNING
    metadata:
      malskills_subtype: security_tool_impairment
      malskills_evidence_type: defense_evasion_and_anti_forensics
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: child_process.exec($CMD, ...)
          - pattern: execSync($CMD, ...)
          - pattern: child_process.execSync($CMD, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(systemctl\s+stop|sc\s+stop|taskkill|killall).*(defender|falcon|crowdstrike|sentinel|edr|agent|audit).*

  - id: javascript.defense_evasion_and_anti_forensics.logging_or_audit_suppression
    languages: [javascript]
    message: JavaScript suppresses logging or audit traces
    severity: WARNING
    metadata:
      malskills_subtype: logging_or_audit_suppression
      malskills_evidence_type: defense_evasion_and_anti_forensics
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: child_process.exec($CMD, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(wevtutil\s+cl|journalctl\s+--vacuum|history\s+-c|unset\s+HISTFILE|rm\s+.*bash_history).*

  - id: javascript.defense_evasion_and_anti_forensics.policy_or_access_control_weakening
    languages: [javascript]
    message: JavaScript weakens firewall or policy controls
    severity: WARNING
    metadata:
      malskills_subtype: policy_or_access_control_weakening
      malskills_evidence_type: defense_evasion_and_anti_forensics
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: child_process.exec($CMD, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(ufw\s+disable|iptables\s+-F|setenforce\s+0).*

