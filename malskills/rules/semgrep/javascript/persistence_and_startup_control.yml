rules:
  - id: javascript.persistence_and_startup_control.scheduled_persistence
    languages: [javascript]
    message: JavaScript creates scheduled persistence
    severity: WARNING
    metadata:
      malskills_subtype: scheduled_persistence
      malskills_sso_category: persistence_and_startup_control
      malskills_value_metavar: $SPEC
    pattern-either:
      - pattern: cron.schedule($SPEC, ...)
      - pattern: nodeCron.schedule($SPEC, ...)
      - pattern: schedule.scheduleJob($SPEC, ...)

  - id: javascript.persistence_and_startup_control.startup_or_service_persistence_cli
    languages: [javascript]
    message: JavaScript establishes startup or service persistence via CLI
    severity: WARNING
    metadata:
      malskills_subtype: service_or_daemon_persistence
      malskills_sso_category: persistence_and_startup_control
      malskills_value_metavar: $CMD
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(systemctl\s+enable|sc\s+create|launchctl\s+load|schtasks|crontab).*
