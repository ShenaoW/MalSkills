rules:
  - id: sso.special.special.0001.const-require-obfuscated
    patterns:
      - pattern: require($X)
      - pattern-not: require("$_")
      - pattern-not: require('$_')
    message: "Suspicious require call with non-literal argument"
    severity: WARNING
    metadata:
      api: require("Obfuscation")
      category: Obfuscation
      malskills_sso_category: cryptography
      malskills_subtype: encoding
    languages:
      - javascript
      - typescript
    tags:
      - Obfuscation
