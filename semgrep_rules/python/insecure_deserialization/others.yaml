rules:
- id: sso.python.insecure_deserialization.others.0001.no-shelve-open
  languages:
  - python
  message: Avoid using shelve.open(), as it can lead to potential issues with insecure deserialization.
  metadata:
    api: shelve.open()
    category: Insecure Deserialization
    malskills_sso_category: payload_execution
    malskills_subtype: unsafe_deserialization
  pattern-either:
  - pattern: shelve.open(...)
  - pattern: $VAR = shelve.open
  severity: WARNING
  tags:
  - Insecure Deserialization
