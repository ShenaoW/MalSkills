rules:
- id: no-marshal-load
  languages:
  - python
  message: Avoid using marshal.load(), as it can lead to potential issues with insecure deserialization.
  metadata:
    api: marshal.load()
    category: Insecure Deserialization
  pattern-either:
  - pattern: marshal.load(...)
  - pattern: $VAR = marshal.load
  severity: WARNING
  tags:
  - Insecure Deserialization
- id: no-marshal-loads
  languages:
  - python
  message: Avoid using marshal.loads(), as it can lead to potential issues with insecure deserialization.
  metadata:
    api: marshal.loads()
    category: Insecure Deserialization
  pattern-either:
  - pattern: marshal.loads(...)
  - pattern: $VAR = marshal.loads
  severity: WARNING
  tags:
  - Insecure Deserialization
