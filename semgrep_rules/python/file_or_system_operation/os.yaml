rules:
- id: sso.python.file_or_system_operation.os.0001.no-os-access
  languages:
  - python
  message: Avoid using os.access(), as it can lead to potential issues with file or system operation.
  metadata:
    api: os.access()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_access
  pattern-either:
  - pattern: os.access(...)
  - pattern: $VAR = os.access
  severity: WARNING
  tags:
  - File or System Operation
