rules:
- id: no-tempfile-NamedTemporaryFile
  languages:
  - python
  message: Avoid using tempfile.NamedTemporaryFile(), as it can lead to potential issues with file or system operation.
  metadata:
    api: tempfile.NamedTemporaryFile()
    category: File or System Operation
  pattern-either:
  - pattern: tempfile.NamedTemporaryFile(...)
  - pattern: $VAR = tempfile.NamedTemporaryFile
  severity: WARNING
  tags:
  - File or System Operation
