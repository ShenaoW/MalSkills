rules:
- id: sso.python.file_or_system_operation.pathlib.0001.no-pathlib-Path-__new__
  languages:
  - python
  message: Avoid using pathlib.Path.__new__(), as it can lead to potential issues with file or system operation.
  metadata:
    api: pathlib.Path.__new__()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_access
  pattern-either:
  - pattern: pathlib.Path.__new__(...)
  - pattern: $VAR = pathlib.Path.__new__
  - pattern: Path.__new__(...)
  - pattern: $VAR = Path.__new__
  severity: WARNING
  tags:
  - File or System Operation
