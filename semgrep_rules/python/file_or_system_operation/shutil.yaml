rules:
- id: sso.python.file_or_system_operation.shutil.0001.no-shutil-_RmtreeType-__call__
  languages:
  - python
  message: Avoid using shutil._RmtreeType.__call__(), as it can lead to potential issues with file or system operation.
  metadata:
    api: shutil._RmtreeType.__call__()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_access
  pattern-either:
  - pattern: shutil._RmtreeType.__call__(...)
  - pattern: $VAR = shutil._RmtreeType.__call__
  - pattern: _RmtreeType.__call__(...)
  - pattern: $VAR = _RmtreeType.__call__
  severity: WARNING
  tags:
  - File or System Operation
