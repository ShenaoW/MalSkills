rules:
- id: no-django-shortcuts-get_list_or_404
  languages:
  - python
  message: Avoid using django.shortcuts.get_list_or_404(), as it can lead to potential issues with command execution.
  metadata:
    api: django.shortcuts.get_list_or_404()
    category: Command Execution
  pattern-either:
  - pattern: django.shortcuts.get_list_or_404(...)
  - pattern: $VAR = django.shortcuts.get_list_or_404
  - pattern: shortcuts.get_list_or_404(...)
  - pattern: $VAR = shortcuts.get_list_or_404
  severity: WARNING
  tags:
  - Command Execution
- id: no-django-shortcuts-get_object_or_404
