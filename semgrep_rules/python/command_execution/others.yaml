rules:
- id: sso.python.command_execution.others.0001.no-nt-system
  languages:
  - python
  message: Avoid using nt.system(), as it can lead to potential issues with command execution.
  metadata:
    api: nt.system()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: nt.system(...)
  - pattern: $VAR = nt.system
  severity: WARNING
  tags:
  - Command Execution
- id: sso.python.command_execution.others.0002.no-posix-system
