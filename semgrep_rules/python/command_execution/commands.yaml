rules:
- id: sso.python.command_execution.commands.0001.no-commands-getoutput
  languages:
  - python
  message: Avoid using commands.getoutput(), as it can lead to potential issues with command execution.
  metadata:
    api: commands.getoutput()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: commands.getoutput(...)
  - pattern: $VAR = commands.getoutput
  severity: WARNING
  tags:
  - Command Execution
- id: sso.python.command_execution.commands.0002.no-commands-getstatusoutput
  languages:
  - python
  message: Avoid using commands.getstatusoutput(), as it can lead to potential issues with command execution.
  metadata:
    api: commands.getstatusoutput()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: commands.getstatusoutput(...)
  - pattern: $VAR = commands.getstatusoutput
  severity: WARNING
  tags:
  - Command Execution
