rules:
- id: sso.python.command_execution.subprocess.0001.no-subprocess-Popen
  languages:
  - python
  message: Avoid using subprocess.Popen(), as it can lead to potential issues with command execution.
  metadata:
    api: subprocess.Popen()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: subprocess.Popen(...)
  - pattern: $VAR = subprocess.Popen
  severity: WARNING
  tags:
  - Command Execution
