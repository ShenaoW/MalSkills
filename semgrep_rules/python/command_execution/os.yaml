rules:
- id: sso.python.command_execution.os.0001.no-os-execl
  languages:
  - python
  message: Avoid using os.execl(), as it can lead to potential issues with command execution.
  metadata:
    api: os.execl()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: os.execl(...)
  - pattern: $VAR = os.execl
  severity: WARNING
  tags:
  - Command Execution
