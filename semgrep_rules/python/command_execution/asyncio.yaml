rules:
- id: sso.python.command_execution.asyncio.0001.no-asyncio-events-AbstractEventLoop-subprocess_exec
  languages:
  - python
  message: Avoid using asyncio.events.AbstractEventLoop.subprocess_exec(), as it can lead to potential issues with command execution.
  metadata:
    api: asyncio.events.AbstractEventLoop.subprocess_exec()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
