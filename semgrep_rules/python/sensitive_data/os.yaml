rules:
- id: no-os-environ
  languages:
  - python
  message: Avoid using os.environ(), as it can lead to potential issues with sensitive data.
  metadata:
    api: os.environ()
    category: Sensitive Data
  pattern-either:
  - pattern: os.environ(...)
  - pattern: $VAR = os.environ
  severity: WARNING
  tags:
  - Sensitive Data
