rules:
- id: sso.python.sensitive_data.os.0001.no-os-environ
  languages:
  - python
  message: Detect access to environment variables.
  metadata:
    api: os.getenv()/os.environ[]
    category: Sensitive Data
    malskills_sso_category: sensitive_data_access
    malskills_subtype: environment_access
  pattern-either:
  - pattern: os.getenv(...)
  - pattern: os.environ[$KEY]
  - pattern: os.environ.get(...)
  - pattern: $VAR = os.environ
  severity: WARNING
  tags:
  - Sensitive Data
- id: sso.python.sensitive_data.os.0002.no-os-getcwd
  languages:
  - python
  message: Avoid using os.getcwd(), as it can lead to potential issues with sensitive data.
  metadata:
    api: os.getcwd()
    category: Sensitive Data
    malskills_sso_category: sensitive_data_access
    malskills_subtype: credential_data_access
  pattern-either:
  - pattern: os.getcwd(...)
  - pattern: $VAR = os.getcwd
  severity: WARNING
  tags:
  - Sensitive Data
