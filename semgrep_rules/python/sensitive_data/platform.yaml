rules:
- id: sso.python.sensitive_data.platform.0001.no-platform-machine
  languages:
  - python
  message: Avoid using platform.machine(), as it can lead to potential issues with sensitive data.
  metadata:
    api: platform.machine()
    category: Sensitive Data
    malskills_sso_category: sensitive_data_access
    malskills_subtype: system_information_access
  pattern-either:
  - pattern: platform.machine(...)
  - pattern: $VAR = platform.machine
  severity: WARNING
  tags:
  - Sensitive Data
