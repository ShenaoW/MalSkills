rules:
- id: sso.python.network_access.socket.0001.no-socket-accept
  languages:
  - python
  message: Avoid using socket.accept(), as it can lead to potential issues with network access.
  metadata:
    api: socket.accept()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: server_listen
  pattern-either:
  - pattern: socket.accept(...)
  - pattern: $VAR = socket.accept
  severity: WARNING
  tags:
  - Network Access
