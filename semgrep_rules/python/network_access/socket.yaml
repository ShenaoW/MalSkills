rules:
- id: no-socket-accept
  languages:
  - python
  message: Avoid using socket.accept(), as it can lead to potential issues with network access.
  metadata:
    api: socket.accept()
    category: Network Access
  pattern-either:
  - pattern: socket.accept(...)
  - pattern: $VAR = socket.accept
  severity: WARNING
  tags:
  - Network Access
