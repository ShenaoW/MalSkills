rules:
- id: sso.python.network_access.aiohttp.0001.no-aiohttp-client-ClientSession
  languages:
  - python
  message: Avoid using aiohttp.client.ClientSession(), as it can lead to potential issues with network access.
  metadata:
    api: aiohttp.client.ClientSession()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: aiohttp.client.ClientSession(...)
  - pattern: $VAR = aiohttp.client.ClientSession
  - pattern: client.ClientSession(...)
  - pattern: $VAR = client.ClientSession
  severity: WARNING
  tags:
  - Network Access
