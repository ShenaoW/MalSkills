rules:
- id: sso.python.network_access.requests.0001.no-requests-api-delete
  languages:
  - python
  message: Avoid using requests.api.delete(), as it can lead to potential issues with network access.
  metadata:
    api: requests.api.delete()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: requests.api.delete(...)
  - pattern: $VAR = requests.api.delete
  - pattern: api.delete(...)
  - pattern: $VAR = api.delete
  severity: WARNING
  tags:
  - Network Access
