rules:
- id: sso.python.network_access.smtplib.0001.no-smtplib-SMTP
  languages:
  - python
  message: Avoid using smtplib.SMTP(), as it can lead to potential issues with network access.
  metadata:
    api: smtplib.SMTP()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: smtplib.SMTP(...)
  - pattern: $VAR = smtplib.SMTP
  severity: WARNING
  tags:
  - Network Access
- id: sso.python.network_access.smtplib.0002.no-smtplib-SMTP-connect
