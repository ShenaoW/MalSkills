rules:
- id: sso.python.network_access.urllib.0001.no-urllib-parse-quote
  languages:
  - python
  message: Avoid using urllib.parse.quote(), as it can lead to potential issues with network access.
  metadata:
    api: urllib.parse.quote()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: urllib.parse.quote(...)
  - pattern: $VAR = urllib.parse.quote
  - pattern: parse.quote(...)
  - pattern: $VAR = parse.quote
  severity: WARNING
  tags:
  - Network Access
