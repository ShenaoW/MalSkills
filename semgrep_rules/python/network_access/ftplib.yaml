rules:
- id: no-ftplib-FTP
  languages:
  - python
  message: Avoid using ftplib.FTP(), as it can lead to potential issues with network access.
  metadata:
    api: ftplib.FTP()
    category: Network Access
  pattern-either:
  - pattern: ftplib.FTP(...)
  - pattern: $VAR = ftplib.FTP
  severity: WARNING
  tags:
  - Network Access
