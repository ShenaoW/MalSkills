rules:
- id: no-webbrowser-open
  languages:
  - python
  message: Avoid using webbrowser.open(), as it can lead to potential issues with network access.
  metadata:
    api: webbrowser.open()
    category: Network Access
  pattern-either:
  - pattern: webbrowser.open(...)
  - pattern: $VAR = webbrowser.open
  severity: WARNING
  tags:
  - Network Access
- id: no-webbrowser-open_new
  languages:
  - python
