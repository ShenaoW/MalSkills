rules:
- id: sso.python.network_access.webbrowser.0001.no-webbrowser-open
  languages:
  - python
  message: Avoid using webbrowser.open(), as it can lead to potential issues with network access.
  metadata:
    api: webbrowser.open()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: webbrowser.open(...)
  - pattern: $VAR = webbrowser.open
  severity: WARNING
  tags:
  - Network Access
- id: sso.python.network_access.webbrowser.0002.no-webbrowser-open_new
