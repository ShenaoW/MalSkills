rules:
- id: sso.python.obfuscation.base64.0001.no-base64-b64decode
  languages:
  - python
  message: Avoid using base64.b64decode(), as it can lead to potential issues with obfuscation.
  metadata:
    api: base64.b64decode()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: decoding
  pattern-either:
  - pattern: base64.b64decode(...)
  - pattern: $VAR = base64.b64decode
  severity: WARNING
  tags:
  - Obfuscation
