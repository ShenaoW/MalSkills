rules:
- id: sso.python.dynamic_execution.others.0001.no-__import__
  languages:
  - python
  message: Avoid using __import__(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: __import__()
    category: Dynamic Execution
    malskills_sso_category: payload_execution
    malskills_subtype: dynamic_code_execution
  pattern-either:
  - pattern: __import__(...)
  - pattern: $VAR = __import__
  severity: WARNING
  tags:
  - Dynamic Execution
