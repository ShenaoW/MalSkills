rules:
- id: no-cryptography-fernet-Fernet
  languages:
  - python
  message: Avoid using cryptography.fernet.Fernet(), as it can lead to potential issues with cryptography.
  metadata:
    api: cryptography.fernet.Fernet()
    category: Cryptography
  pattern-either:
  - pattern: cryptography.fernet.Fernet(...)
  - pattern: $VAR = cryptography.fernet.Fernet
  - pattern: fernet.Fernet(...)
  - pattern: $VAR = fernet.Fernet
  severity: WARNING
  tags:
  - Cryptography
