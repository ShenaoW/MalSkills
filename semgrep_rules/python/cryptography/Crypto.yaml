rules:
- id: sso.python.cryptography.Crypto.0001.no-Crypto-Cipher-AES-new
  languages:
  - python
  message: Avoid using Crypto.Cipher.AES.new(), as it can lead to potential issues with cryptography.
  metadata:
    api: Crypto.Cipher.AES.new()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: encryption
  pattern-either:
  - pattern: Crypto.Cipher.AES.new(...)
  - pattern: $VAR = Crypto.Cipher.AES.new
  - pattern: Cipher.AES.new(...)
  - pattern: $VAR = Cipher.AES.new
  - pattern: AES.new(...)
  - pattern: $VAR = AES.new
  severity: WARNING
  tags:
  - Cryptography
- id: sso.python.cryptography.Crypto.0002.no-Crypto-Cipher-DES-new
