rules:
- id: no-rsa-PrivateKey
  languages:
  - python
  message: Avoid using rsa.PrivateKey(), as it can lead to potential issues with cryptography.
  metadata:
    api: rsa.PrivateKey()
    category: Cryptography
  pattern-either:
  - pattern: rsa.PrivateKey(...)
  - pattern: $VAR = rsa.PrivateKey
  severity: WARNING
  tags:
  - Cryptography
