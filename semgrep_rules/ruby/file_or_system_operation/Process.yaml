rules:
- id: no-Process.getpgid
  languages:
  - ruby
  message: Avoid using Process.getpgid(), as it can lead to potential issues with file or system operation.
  metadata:
    api: Process.getpgid()
    category: File or System Operation
  pattern-either:
  - pattern: Process.getpgid(...)
  - pattern: $VAR = Process.getpgid
  severity: WARNING
  tags:
  - File or System Operation
