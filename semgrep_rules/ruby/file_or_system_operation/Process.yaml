rules:
- id: sso.ruby.file_or_system_operation.Process.0001.no-Process.getpgid
  languages:
  - ruby
  message: Avoid using Process.getpgid(), as it can lead to potential issues with file or system operation.
  metadata:
    api: Process.getpgid()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_access
  pattern-either:
  - pattern: Process.getpgid(...)
  - pattern: $VAR = Process.getpgid
  severity: WARNING
  tags:
  - File or System Operation
