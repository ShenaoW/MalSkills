rules:
- id: no-File.absolute_path
  languages:
  - ruby
  message: Avoid using File.absolute_path(), as it can lead to potential issues with file or system operation.
  metadata:
    api: File.absolute_path()
    category: File or System Operation
  pattern-either:
  - pattern: File.absolute_path(...)
  - pattern: $VAR = File.absolute_path
  severity: WARNING
  tags:
  - File or System Operation
