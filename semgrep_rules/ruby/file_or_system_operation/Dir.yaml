rules:
- id: no-Dir.chdir
  languages:
  - ruby
  message: Avoid using Dir.chdir(), as it can lead to potential issues with file or system operation.
  metadata:
    api: Dir.chdir()
    category: File or System Operation
  pattern-either:
  - pattern: Dir.chdir(...)
  - pattern: $VAR = Dir.chdir
  severity: WARNING
  tags:
  - File or System Operation
