rules:
- id: sso.ruby.file_or_system_operation.Dir.0001.no-Dir.chdir
  languages:
  - ruby
  message: Avoid using Dir.chdir(), as it can lead to potential issues with file or system operation.
  metadata:
    api: Dir.chdir()
    category: File or System Operation
    malskills_sso_category: system_configuration
    malskills_subtype: system_configuration_modify
  pattern-either:
  - pattern: Dir.chdir(...)
  - pattern: $VAR = Dir.chdir
  severity: WARNING
  tags:
  - File or System Operation
