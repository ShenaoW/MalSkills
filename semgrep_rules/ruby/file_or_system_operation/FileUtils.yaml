rules:
- id: sso.ruby.file_or_system_operation.FileUtils.0001.no-FileUtils.chmod
  languages:
  - ruby
  message: Avoid using FileUtils.chmod(), as it can lead to potential issues with file or system operation.
  metadata:
    api: FileUtils.chmod()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_permission_modify
  pattern-either:
  - pattern: FileUtils.chmod(...)
  - pattern: $VAR = FileUtils.chmod
  severity: WARNING
  tags:
  - File or System Operation
