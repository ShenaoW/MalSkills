rules:
- id: no-IO.foreach
  languages:
  - ruby
  message: Avoid using IO.foreach(), as it can lead to potential issues with file or system operation.
  metadata:
    api: IO.foreach()
    category: File or System Operation
  pattern-either:
  - pattern: IO.foreach(...)
  - pattern: $VAR = IO.foreach
  severity: WARNING
  tags:
  - File or System Operation
