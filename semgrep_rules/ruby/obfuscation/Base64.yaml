rules:
- id: no-Base64.decode64
  languages:
  - ruby
  message: Avoid using Base64.decode64(), as it can lead to potential issues with obfuscation.
  metadata:
    api: Base64.decode64()
    category: Obfuscation
  pattern-either:
  - pattern: Base64.decode64(...)
  - pattern: $VAR = Base64.decode64
  severity: WARNING
  tags:
  - Obfuscation
