rules:
- id: no-Array_x_join
  languages:
  - ruby
  message: Avoid using Array#join(), as it can lead to potential issues with obfuscation.
  metadata:
    api: Array#join()
    category: Obfuscation
  pattern-either:
  - pattern: Array#join(...)
  - pattern: $VAR = Array#join
  severity: WARNING
  tags:
  - Obfuscation
