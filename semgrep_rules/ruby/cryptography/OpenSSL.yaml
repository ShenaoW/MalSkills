rules:
- id: no-OpenSSL_x__x_Cipher.decrypt
  languages:
  - ruby
  message: Avoid using OpenSSL::Cipher.decrypt(), as it can lead to potential issues with cryptography.
  metadata:
    api: OpenSSL::Cipher.decrypt()
    category: Cryptography
  pattern-either:
  - pattern: OpenSSL::Cipher.decrypt(...)
  - pattern: $VAR = OpenSSL::Cipher.decrypt
  - pattern: Cipher.decrypt(...)
  - pattern: $VAR = Cipher.decrypt
  severity: WARNING
  tags:
  - Cryptography
