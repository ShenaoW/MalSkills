rules:
- id: no-rsa.decrypt
  languages:
  - ruby
  message: Avoid using rsa.decrypt(), as it can lead to potential issues with cryptography.
  metadata:
    api: rsa.decrypt()
    category: Cryptography
  pattern-either:
  - pattern: rsa.decrypt(...)
  - pattern: $VAR = rsa.decrypt
  severity: WARNING
  tags:
  - Cryptography
