rules:
- id: no-cipher.final
  languages:
  - ruby
  message: Avoid using cipher.final(), as it can lead to potential issues with cryptography.
  metadata:
    api: cipher.final()
    category: Cryptography
  pattern-either:
  - pattern: cipher.final(...)
  - pattern: $VAR = cipher.final
  severity: WARNING
  tags:
  - Cryptography
- id: no-cipher.update
  languages:
  - ruby
  message: Avoid using cipher.update(), as it can lead to potential issues with cryptography.
  metadata:
    api: cipher.update()
    category: Cryptography
  pattern-either:
  - pattern: cipher.update(...)
  - pattern: $VAR = cipher.update
  severity: WARNING
  tags:
  - Cryptography
