rules:
- id: sso.ruby.cryptography.SecureRandom.0001.no-SecureRandom.base64
  languages:
  - ruby
  message: Avoid using SecureRandom.base64(), as it can lead to potential issues with cryptography.
  metadata:
    api: SecureRandom.base64()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: encoding
  pattern-either:
  - pattern: SecureRandom.base64(...)
  - pattern: $VAR = SecureRandom.base64
  severity: WARNING
  tags:
  - Cryptography
- id: sso.ruby.cryptography.SecureRandom.0002.no-SecureRandom.hex
