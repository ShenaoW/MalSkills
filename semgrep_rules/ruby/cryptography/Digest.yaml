rules:
- id: sso.ruby.cryptography.Digest.0001.no-Digest_x__x_HMAC.hexdigest
  languages:
  - ruby
  message: Avoid using Digest::HMAC.hexdigest(), as it can lead to potential issues with cryptography.
  metadata:
    api: Digest::HMAC.hexdigest()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: hashing
  pattern-either:
  - pattern: Digest::HMAC.hexdigest(...)
  - pattern: $VAR = Digest::HMAC.hexdigest
  - pattern: HMAC.hexdigest(...)
  - pattern: $VAR = HMAC.hexdigest
  severity: WARNING
  tags:
  - Cryptography
