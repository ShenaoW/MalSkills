rules:
- id: no-Process.fork
  languages:
  - ruby
  message: Avoid using Process.fork(), as it can lead to potential issues with command execution.
  metadata:
    api: Process.fork()
    category: Command Execution
  pattern-either:
  - pattern: Process.fork(...)
  - pattern: $VAR = Process.fork
  severity: WARNING
  tags:
  - Command Execution
- id: no-Process.spawn
  languages:
  - ruby
  message: Avoid using Process.spawn(), as it can lead to potential issues with command execution.
  metadata:
    api: Process.spawn()
    category: Command Execution
  pattern-either:
  - pattern: Process.spawn(...)
  - pattern: $VAR = Process.spawn
  - pattern: spawn(...)
  - pattern: $VAR = spawn
  severity: WARNING
  tags:
  - Command Execution
