rules:
- id: sso.ruby.command_execution.others.0001.no-exec
  languages:
  - ruby
  message: Avoid using exec(), as it can lead to potential issues with command execution.
  metadata:
    api: exec()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: exec(...)
  - pattern: $VAR = exec
  severity: WARNING
  tags:
  - Command Execution
- id: sso.ruby.command_execution.others.0002.no-system
