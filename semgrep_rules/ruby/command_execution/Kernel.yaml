rules:
- id: sso.ruby.command_execution.Kernel.0001.no-Kernel.exec
  languages:
  - ruby
  message: Avoid using Kernel.exec(), as it can lead to potential issues with command execution.
  metadata:
    api: Kernel.exec()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: Kernel.exec(...)
  - pattern: $VAR = Kernel.exec
  - pattern: exec(...)
  - pattern: $VAR = exec
  severity: WARNING
  tags:
  - Command Execution
