rules:
- id: no-Kernel.exec
  languages:
  - ruby
  message: Avoid using Kernel.exec(), as it can lead to potential issues with command execution.
  metadata:
    api: Kernel.exec()
    category: Command Execution
  pattern-either:
  - pattern: Kernel.exec(...)
  - pattern: $VAR = Kernel.exec
  - pattern: exec(...)
  - pattern: $VAR = exec
  severity: WARNING
  tags:
  - Command Execution
