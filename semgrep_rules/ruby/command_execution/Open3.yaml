rules:
- id: sso.ruby.command_execution.Open3.0001.no-Open3.capture2
  languages:
  - ruby
  message: Avoid using Open3.capture2(), as it can lead to potential issues with command execution.
  metadata:
    api: Open3.capture2()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: Open3.capture2(...)
  - pattern: $VAR = Open3.capture2
  severity: WARNING
  tags:
  - Command Execution
