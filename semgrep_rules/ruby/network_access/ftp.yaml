rules:
- id: sso.ruby.network_access.ftp.0001.no-ftp.chdir
  languages:
  - ruby
  message: Avoid using ftp.chdir(), as it can lead to potential issues with network access.
  metadata:
    api: ftp.chdir()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: ftp.chdir(...)
  - pattern: $VAR = ftp.chdir
  severity: WARNING
  tags:
  - Network Access
