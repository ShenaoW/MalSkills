rules:
- id: sso.ruby.network_access.URI.0001.no-URI.open
  languages:
  - ruby
  message: Avoid using URI.open(), as it can lead to potential issues with network access.
  metadata:
    api: URI.open()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: URI.open(...)
  - pattern: $VAR = URI.open
  severity: WARNING
  tags:
  - Network Access
- id: sso.ruby.network_access.URI.0002.no-URI.parse
  languages:
  - ruby
  message: Avoid using URI.parse(), as it can lead to potential issues with network access.
  metadata:
    api: URI.parse()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: URI.parse(...)
  - pattern: $VAR = URI.parse
  severity: WARNING
  tags:
  - Network Access
