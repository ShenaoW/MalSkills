rules:
- id: no-UDPSocket.bind
  languages:
  - ruby
  message: Avoid using UDPSocket.bind(), as it can lead to potential issues with network access.
  metadata:
    api: UDPSocket.bind()
    category: Network Access
  pattern-either:
  - pattern: UDPSocket.bind(...)
  - pattern: $VAR = UDPSocket.bind
  severity: WARNING
  tags:
  - Network Access
