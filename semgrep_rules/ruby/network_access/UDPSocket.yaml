rules:
- id: sso.ruby.network_access.UDPSocket.0001.no-UDPSocket.bind
  languages:
  - ruby
  message: Avoid using UDPSocket.bind(), as it can lead to potential issues with network access.
  metadata:
    api: UDPSocket.bind()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: server_listen
  pattern-either:
  - pattern: UDPSocket.bind(...)
  - pattern: $VAR = UDPSocket.bind
  severity: WARNING
  tags:
  - Network Access
