rules:
- id: no-open
  languages:
  - ruby
  message: Avoid using open(), as it can lead to potential issues with network access.
  metadata:
    api: open()
    category: Network Access
  pattern-either:
  - pattern: open(...)
  - pattern: $VAR = open
  severity: WARNING
  tags:
  - Network Access
- id: no-OpenSSL_x__x_SSL_x__x_SSLSocket.new
  languages:
  - ruby
  message: Avoid using OpenSSL::SSL::SSLSocket.new(), as it can lead to potential issues with network access.
  metadata:
    api: OpenSSL::SSL::SSLSocket.new()
    category: Network Access
  pattern-either:
  - pattern: OpenSSL::SSL::SSLSocket.new(...)
  - pattern: $VAR = OpenSSL::SSL::SSLSocket.new
  - pattern: SSL::SSLSocket.new(...)
  - pattern: $VAR = SSL::SSLSocket.new
  - pattern: SSLSocket.new(...)
  - pattern: $VAR = SSLSocket.new
  severity: WARNING
  tags:
  - Network Access
