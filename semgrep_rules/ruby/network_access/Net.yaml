rules:
- id: no-Net_x__x_FTP.new
  languages:
  - ruby
  message: Avoid using Net::FTP.new(), as it can lead to potential issues with network access.
  metadata:
    api: Net::FTP.new()
    category: Network Access
  pattern-either:
  - pattern: Net::FTP.new(...)
  - pattern: $VAR = Net::FTP.new
  - pattern: FTP.new(...)
  - pattern: $VAR = FTP.new
  severity: WARNING
  tags:
  - Network Access
