rules:
- id: no-Socket.connect
  languages:
  - ruby
  message: Avoid using Socket.connect(), as it can lead to potential issues with network access.
  metadata:
    api: Socket.connect()
    category: Network Access
  pattern-either:
  - pattern: Socket.connect(...)
  - pattern: $VAR = Socket.connect
  severity: WARNING
  tags:
  - Network Access
