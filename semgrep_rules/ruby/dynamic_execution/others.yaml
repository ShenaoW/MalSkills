rules:
- id: no-class_eval
  languages:
  - ruby
  message: Avoid using class_eval(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: class_eval()
    category: Dynamic Execution
  pattern-either:
  - pattern: class_eval(...)
  - pattern: $VAR = class_eval
  severity: WARNING
  tags:
  - Dynamic Execution
