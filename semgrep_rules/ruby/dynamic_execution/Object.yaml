rules:
- id: sso.ruby.dynamic_execution.Object.0001.no-Object.const_get
  languages:
  - ruby
  message: Avoid using Object.const_get(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: Object.const_get()
    category: Dynamic Execution
    malskills_sso_category: payload_execution
    malskills_subtype: dynamic_code_execution
  pattern-either:
  - pattern: Object.const_get(...)
  - pattern: $VAR = Object.const_get
  severity: WARNING
  tags:
  - Dynamic Execution
