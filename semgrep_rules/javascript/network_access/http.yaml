rules:
- id: sso.javascript.network_access.http.0001.no-http-Agent
  languages:
  - javascript
  message: Avoid using http.Agent(), as it can lead to potential issues with network access.
  metadata:
    api: http.Agent()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: http.Agent(...)
  - pattern: $VAR = http.Agent
  severity: WARNING
  tags:
  - Network Access
