rules:
- id: sso.javascript.network_access.https.0001.no-https-Agent
  languages:
  - javascript
  message: Avoid using https.Agent(), as it can lead to potential issues with network access.
  metadata:
    api: https.Agent()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: https.Agent(...)
  - pattern: $VAR = https.Agent
  severity: WARNING
  tags:
  - Network Access
