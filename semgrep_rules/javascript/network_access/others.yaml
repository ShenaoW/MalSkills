rules:
- id: sso.javascript.network_access.others.0001.no-2captcha-Solver
  languages:
  - javascript
  message: Avoid using 2captcha.Solver(), as it can lead to potential issues with network access.
  metadata:
    api: 2captcha.Solver()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: require("2captcha").Solver(...)
  - pattern: require('2captcha').Solver(...)
  severity: WARNING
  tags:
  - Network Access
