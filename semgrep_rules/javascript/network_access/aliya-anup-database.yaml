rules:
- id: no-aliya-anup-database-get
  languages:
  - javascript
  message: Avoid using aliya-anup-database.get(), as it can lead to potential issues with network access.
  metadata:
    api: aliya-anup-database.get()
    category: Network Access
  pattern-either:
  - pattern: aliya-anup-database.get(...)
  - pattern: $VAR = aliya-anup-database.get
  severity: WARNING
  tags:
  - Network Access
