rules:
- id: sso.javascript.network_access.aliya-anup-database.0001.no-aliya-anup-database-get
  languages:
  - javascript
  message: Avoid using aliya-anup-database.get(), as it can lead to potential issues with network access.
  metadata:
    api: aliya-anup-database.get()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: data_receive
  pattern-either:
  - pattern: aliya-anup-database.get(...)
  - pattern: $VAR = aliya-anup-database.get
  severity: WARNING
  tags:
  - Network Access
