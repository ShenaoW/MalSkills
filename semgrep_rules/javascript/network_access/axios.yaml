rules:
- id: sso.javascript.network_access.axios.0001.no-axios-delete
  languages:
  - javascript
  message: Avoid using axios.delete(), as it can lead to potential issues with network access.
  metadata:
    api: axios.delete()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: axios.delete(...)
  - pattern: $VAR = axios.delete
  severity: WARNING
  tags:
  - Network Access
