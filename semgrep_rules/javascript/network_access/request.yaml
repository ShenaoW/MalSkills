rules:
- id: sso.javascript.network_access.request.0001.no-request-delete
  languages:
  - javascript
  message: Avoid using request.delete(), as it can lead to potential issues with network access.
  metadata:
    api: request.delete()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: request.delete(...)
  - pattern: $VAR = request.delete
  severity: WARNING
  tags:
  - Network Access
