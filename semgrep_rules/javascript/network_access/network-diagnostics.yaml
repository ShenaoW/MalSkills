rules:
- id: sso.javascript.network_access.network-diagnostics.0001.no-network-diagnostics-haveDNS
  languages:
  - javascript
  message: Avoid using network-diagnostics.haveDNS(), as it can lead to potential issues with network access.
  metadata:
    api: network-diagnostics.haveDNS()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: dns_resolution
  pattern-either:
  - pattern: network-diagnostics.haveDNS(...)
  - pattern: $VAR = network-diagnostics.haveDNS
  severity: WARNING
  tags:
  - Network Access
