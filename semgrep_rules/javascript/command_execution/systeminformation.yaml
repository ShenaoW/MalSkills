rules:
- id: no-systeminformation-bios
  languages:
  - javascript
  message: Avoid using systeminformation.bios(), as it can lead to potential issues with command execution.
  metadata:
    api: systeminformation.bios()
    category: Command Execution
  pattern-either:
  - pattern: systeminformation.bios(...)
  - pattern: $VAR = systeminformation.bios
  severity: WARNING
  tags:
  - Command Execution
