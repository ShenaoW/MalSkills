rules:
- id: no-process-_debugEnd
  languages:
  - javascript
  message: Avoid using process._debugEnd(), as it can lead to potential issues with command execution.
  metadata:
    api: process._debugEnd()
    category: Command Execution
  pattern-either:
  - pattern: process._debugEnd(...)
  - pattern: $VAR = process._debugEnd
  severity: WARNING
  tags:
  - Command Execution
