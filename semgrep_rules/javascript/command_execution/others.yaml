rules:
- id: sso.javascript.command_execution.others.0001.no-eval
  languages:
  - javascript
  message: Avoid using eval(), as it can lead to potential issues with command execution.
  metadata:
    api: eval()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: eval(...)
  - pattern: $VAR = eval
  severity: WARNING
  tags:
  - Command Execution
