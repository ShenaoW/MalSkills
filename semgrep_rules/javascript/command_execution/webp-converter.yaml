rules:
- id: sso.javascript.command_execution.webp-converter.0001.no-webp-converter-cwebp
  languages:
  - javascript
  message: Avoid using webp-converter.cwebp(), as it can lead to potential issues with command execution.
  metadata:
    api: webp-converter.cwebp()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: webp-converter.cwebp(...)
  - pattern: $VAR = webp-converter.cwebp
  severity: WARNING
  tags:
  - Command Execution
