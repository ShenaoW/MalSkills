rules:
- id: sso.javascript.command_execution.child_process.0001.no-child_process-exec
  languages:
  - javascript
  message: Avoid using child_process.exec(), as it can lead to potential issues with command execution.
  metadata:
    api: child_process.exec()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: child_process.exec(...)
  - pattern: $VAR = child_process.exec
  - pattern: exec(...)
  - pattern: $VAR = exec
  severity: WARNING
  tags:
  - Command Execution
