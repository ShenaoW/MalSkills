rules:
- id: no-dustjs-linkedin-loadSource
  languages:
  - javascript
  message: Avoid using dustjs-linkedin.loadSource(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: dustjs-linkedin.loadSource()
    category: Dynamic Execution
  pattern-either:
  - pattern: dustjs-linkedin.loadSource(...)
  - pattern: $VAR = dustjs-linkedin.loadSource
  severity: WARNING
  tags:
  - Dynamic Execution
