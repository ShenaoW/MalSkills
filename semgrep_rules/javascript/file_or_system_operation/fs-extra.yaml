rules:
- id: no-fs-extra-appendFileSync
  languages:
  - javascript
  message: Avoid using fs-extra.appendFileSync(), as it can lead to potential issues with file or system operation.
  metadata:
    api: fs-extra.appendFileSync()
    category: File or System Operation
  pattern-either:
  - pattern: fs-extra.appendFileSync(...)
  - pattern: $VAR = fs-extra.appendFileSync
  severity: WARNING
  tags:
  - File or System Operation
