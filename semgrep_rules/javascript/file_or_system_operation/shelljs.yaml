rules:
- id: sso.javascript.file_or_system_operation.shelljs.0001.no-shelljs-cd
  languages:
  - javascript
  message: Avoid using shelljs.cd(), as it can lead to potential issues with file or system operation.
  metadata:
    api: shelljs.cd()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_access
  pattern-either:
  - pattern: shelljs.cd(...)
  - pattern: $VAR = shelljs.cd
  severity: WARNING
  tags:
  - File or System Operation
