rules:
- id: no-os-arch
  languages:
  - javascript
  message: Avoid using os.arch(), as it can lead to potential issues with file or system operation.
  metadata:
    api: os.arch()
    category: File or System Operation
  pattern-either:
  - pattern: os.arch(...)
  - pattern: $VAR = os.arch
  severity: WARNING
  tags:
  - File or System Operation
