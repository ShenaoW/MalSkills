- id: sso.javascript.file_or_system_operation.temp.0004.no-require-temp
  languages:
  - javascript
  message: Avoid using require('temp'), as it can lead to potential issues with file or system operation.
  metadata:
    api: require('temp')
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_access
  pattern: require('temp')
  severity: WARNING
  tags:
  - File or System Operation
