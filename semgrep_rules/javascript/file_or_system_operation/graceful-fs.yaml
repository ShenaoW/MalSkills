rules:
- id: no-graceful-fs-chmod
  languages:
  - javascript
  message: Avoid using graceful-fs.chmod(), as it can lead to potential issues with file or system operation.
  metadata:
    api: graceful-fs.chmod()
    category: File or System Operation
  pattern-either:
  - pattern: graceful-fs.chmod(...)
  - pattern: $VAR = graceful-fs.chmod
  severity: WARNING
  tags:
  - File or System Operation
