rules:
- id: no-ape-updating-updateDependencies
  languages:
  - javascript
  message: Avoid using ape-updating.updateDependencies(), as it can lead to potential issues with file or system operation.
  metadata:
    api: ape-updating.updateDependencies()
    category: File or System Operation
  pattern-either:
  - pattern: ape-updating.updateDependencies(...)
  - pattern: $VAR = ape-updating.updateDependencies
  severity: WARNING
  tags:
  - File or System Operation
