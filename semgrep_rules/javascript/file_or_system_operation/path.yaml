rules:
- id: sso.javascript.file_or_system_operation.path.0001.no-path-_makeLong
  languages:
  - javascript
  message: Avoid using path._makeLong(), as it can lead to potential issues with file or system operation.
  metadata:
    api: path._makeLong()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_access
  pattern-either:
  - pattern: path._makeLong(...)
  - pattern: $VAR = path._makeLong
  severity: WARNING
  tags:
  - File or System Operation
