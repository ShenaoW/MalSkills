rules:
- id: no-System-AppDomain-CreateInstance
  languages:
  - csharp
  message: Avoid using System.AppDomain.CreateInstance(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: System.AppDomain.CreateInstance()
    category: Dynamic Execution
  pattern-either:
  - pattern: System.AppDomain.CreateInstance(...)
  - pattern: $VAR = System.AppDomain.CreateInstance
  - pattern: AppDomain.CreateInstance(...)
  - pattern: $VAR = AppDomain.CreateInstance
  severity: WARNING
  tags:
  - Dynamic Execution
