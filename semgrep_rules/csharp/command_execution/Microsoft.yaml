rules:
- id: sso.csharp.command_execution.Microsoft.0001.no-Microsoft-CSharp-CSharpCodeProvider-CompileAssemblyFromSource
  languages:
  - csharp
  message: Avoid using Microsoft.CSharp.CSharpCodeProvider.CompileAssemblyFromSource(), as it can lead to potential issues with command execution.
  metadata:
    api: Microsoft.CSharp.CSharpCodeProvider.CompileAssemblyFromSource()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: Microsoft.CSharp.CSharpCodeProvider.CompileAssemblyFromSource(...)
  - pattern: $VAR = Microsoft.CSharp.CSharpCodeProvider.CompileAssemblyFromSource
  - pattern: CSharp.CSharpCodeProvider.CompileAssemblyFromSource(...)
  - pattern: $VAR = CSharp.CSharpCodeProvider.CompileAssemblyFromSource
  - pattern: CSharpCodeProvider.CompileAssemblyFromSource(...)
  - pattern: $VAR = CSharpCodeProvider.CompileAssemblyFromSource
  severity: WARNING
  tags:
  - Command Execution
