rules:
- id: sso.csharp.file_or_system_operation.Microsoft.0001.no-Microsoft-Win32-RegistryKey-CreateSubKey
  languages:
  - csharp
  message: Avoid using Microsoft.Win32.RegistryKey.CreateSubKey(), as it can lead to potential issues with file or system operation.
  metadata:
    api: Microsoft.Win32.RegistryKey.CreateSubKey()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_create
  pattern-either:
  - pattern: Microsoft.Win32.RegistryKey.CreateSubKey(...)
  - pattern: $VAR = Microsoft.Win32.RegistryKey.CreateSubKey
  - pattern: Win32.RegistryKey.CreateSubKey(...)
  - pattern: $VAR = Win32.RegistryKey.CreateSubKey
  - pattern: RegistryKey.CreateSubKey(...)
  - pattern: $VAR = RegistryKey.CreateSubKey
  severity: WARNING
  tags:
  - File or System Operation
