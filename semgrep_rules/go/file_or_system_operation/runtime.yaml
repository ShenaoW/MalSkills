rules:
- id: sso.go.file_or_system_operation.runtime.0001.no-runtime.GOARCH
  languages:
  - go
  message: Avoid using runtime.GOARCH(), as it can lead to potential issues with file or system operation.
  metadata:
    api: runtime.GOARCH()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_access
  pattern-either:
  - pattern: runtime.GOARCH(...)
  - pattern: $VAR = runtime.GOARCH
  severity: WARNING
  tags:
  - File or System Operation
