rules:
- id: sso.go.file_or_system_operation.ioutil.0001.no-ioutil.ReadDir
  languages:
  - go
  message: Avoid using ioutil.ReadDir(), as it can lead to potential issues with file or system operation.
  metadata:
    api: ioutil.ReadDir()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_search
  pattern-either:
  - pattern: ioutil.ReadDir(...)
  - pattern: $VAR = ioutil.ReadDir
  severity: WARNING
  tags:
  - File or System Operation
