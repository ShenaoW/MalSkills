rules:
- id: no-bufio.NewReader
  languages:
  - go
  message: Avoid using bufio.NewReader(), as it can lead to potential issues with file or system operation.
  metadata:
    api: bufio.NewReader()
    category: File or System Operation
  pattern-either:
  - pattern: bufio.NewReader(...)
  - pattern: $VAR = bufio.NewReader
  severity: WARNING
  tags:
  - File or System Operation
