rules:
- id: sso.go.file_or_system_operation.fmt.0001.no-fmt.Fprint
  languages:
  - go
  message: Avoid using fmt.Fprint(), as it can lead to potential issues with file or system operation.
  metadata:
    api: fmt.Fprint()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_access
  pattern-either:
  - pattern: fmt.Fprint(...)
  - pattern: $VAR = fmt.Fprint
  severity: WARNING
  tags:
  - File or System Operation
