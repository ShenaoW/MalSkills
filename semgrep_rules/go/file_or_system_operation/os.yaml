rules:
- id: sso.go.file_or_system_operation.os.0001.no-os.Chdir
  languages:
  - go
  message: Avoid using os.Chdir(), as it can lead to potential issues with file or system operation.
  metadata:
    api: os.Chdir()
    category: File or System Operation
    malskills_sso_category: system_configuration
    malskills_subtype: system_configuration_modify
  pattern-either:
  - pattern: os.Chdir(...)
  - pattern: $VAR = os.Chdir
  severity: WARNING
  tags:
  - File or System Operation
