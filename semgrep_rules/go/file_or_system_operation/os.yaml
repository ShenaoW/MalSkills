rules:
- id: no-os.Chdir
  languages:
  - go
  message: Avoid using os.Chdir(), as it can lead to potential issues with file or system operation.
  metadata:
    api: os.Chdir()
    category: File or System Operation
  pattern-either:
  - pattern: os.Chdir(...)
  - pattern: $VAR = os.Chdir
  severity: WARNING
  tags:
  - File or System Operation
