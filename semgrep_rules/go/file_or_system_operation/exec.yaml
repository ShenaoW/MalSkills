rules:
- id: no-exec.Command_x__x_.CombinedOutput
  languages:
  - go
  message: Avoid using exec.Command().CombinedOutput(), as it can lead to potential issues with file or system operation.
  metadata:
    api: exec.Command().CombinedOutput()
    category: File or System Operation
  pattern-either:
  - pattern: exec.Command().CombinedOutput(...)
  - pattern: $VAR = exec.Command().CombinedOutput
  - pattern: Command().CombinedOutput(...)
  - pattern: $VAR = Command().CombinedOutput
  severity: WARNING
  tags:
  - File or System Operation
- id: no-exec.Command_x__x_.Start
  languages:
  - go
  message: Avoid using exec.Command().Start(), as it can lead to potential issues with file or system operation.
  metadata:
    api: exec.Command().Start()
    category: File or System Operation
  pattern-either:
  - pattern: exec.Command().Start(...)
  - pattern: $VAR = exec.Command().Start
  - pattern: Command().Start(...)
  - pattern: $VAR = Command().Start
  severity: WARNING
  tags:
  - File or System Operation
