rules:
- id: sso.go.file_or_system_operation.file.0001.no-file.Chmod
  languages:
  - go
  message: Avoid using file.Chmod(), as it can lead to potential issues with file or system operation.
  metadata:
    api: file.Chmod()
    category: File or System Operation
    malskills_sso_category: file_operation
    malskills_subtype: file_permission_modify
  pattern-either:
  - pattern: file.Chmod(...)
  - pattern: $VAR = file.Chmod
  severity: WARNING
  tags:
  - File or System Operation
