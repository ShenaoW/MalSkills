rules:
- id: sso.go.cryptography.rand.0001.no-rand.Int
  languages:
  - go
  message: Avoid using rand.Int(), as it can lead to potential issues with cryptography.
  metadata:
    api: rand.Int()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: cryptographic_operation
  pattern-either:
  - pattern: rand.Int(...)
  - pattern: $VAR = rand.Int
  severity: WARNING
  tags:
  - Cryptography
- id: sso.go.cryptography.rand.0002.no-rand.Intn
