rules:
- id: sso.go.cryptography.cipher.0001.no-cipher.NewCBCDecrypter
  languages:
  - go
  message: Avoid using cipher.NewCBCDecrypter(), as it can lead to potential issues with cryptography.
  metadata:
    api: cipher.NewCBCDecrypter()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: decryption
  pattern-either:
  - pattern: cipher.NewCBCDecrypter(...)
  - pattern: $VAR = cipher.NewCBCDecrypter
  severity: WARNING
  tags:
  - Cryptography
