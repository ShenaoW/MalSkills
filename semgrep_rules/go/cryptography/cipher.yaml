rules:
- id: no-cipher.NewCBCDecrypter
  languages:
  - go
  message: Avoid using cipher.NewCBCDecrypter(), as it can lead to potential issues with cryptography.
  metadata:
    api: cipher.NewCBCDecrypter()
    category: Cryptography
  pattern-either:
  - pattern: cipher.NewCBCDecrypter(...)
  - pattern: $VAR = cipher.NewCBCDecrypter
  severity: WARNING
  tags:
  - Cryptography
