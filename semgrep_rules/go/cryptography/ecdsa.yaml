rules:
- id: sso.go.cryptography.ecdsa.0001.no-ecdsa.GenerateKey
  languages:
  - go
  message: Avoid using ecdsa.GenerateKey(), as it can lead to potential issues with cryptography.
  metadata:
    api: ecdsa.GenerateKey()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: cipher_object_creation
  pattern-either:
  - pattern: ecdsa.GenerateKey(...)
  - pattern: $VAR = ecdsa.GenerateKey
  severity: WARNING
  tags:
  - Cryptography
- id: sso.go.cryptography.ecdsa.0002.no-ecdsa.Sign
