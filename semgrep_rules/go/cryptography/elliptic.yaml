rules:
- id: no-elliptic.P256
  languages:
  - go
  message: Avoid using elliptic.P256(), as it can lead to potential issues with cryptography.
  metadata:
    api: elliptic.P256()
    category: Cryptography
  pattern-either:
  - pattern: elliptic.P256(...)
  - pattern: $VAR = elliptic.P256
  severity: WARNING
  tags:
  - Cryptography
