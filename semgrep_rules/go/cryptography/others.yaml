rules:
- id: no-md5.New
  languages:
  - go
  message: Avoid using md5.New(), as it can lead to potential issues with cryptography.
  metadata:
    api: md5.New()
    category: Cryptography
  pattern-either:
  - pattern: md5.New(...)
  - pattern: $VAR = md5.New
  severity: WARNING
  tags:
  - Cryptography
