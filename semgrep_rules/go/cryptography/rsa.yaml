rules:
- id: sso.go.cryptography.rsa.0001.no-rsa.DecryptOAEP
  languages:
  - go
  message: Avoid using rsa.DecryptOAEP(), as it can lead to potential issues with cryptography.
  metadata:
    api: rsa.DecryptOAEP()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: decryption
  pattern-either:
  - pattern: rsa.DecryptOAEP(...)
  - pattern: $VAR = rsa.DecryptOAEP
  severity: WARNING
  tags:
  - Cryptography
