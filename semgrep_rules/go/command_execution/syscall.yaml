rules:
- id: sso.go.command_execution.syscall.0001.no-syscall.Exec
  languages:
  - go
  message: Avoid using syscall.Exec(), as it can lead to potential issues with command execution.
  metadata:
    api: syscall.Exec()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: syscall.Exec(...)
  - pattern: $VAR = syscall.Exec
  - pattern: Exec(...)
  - pattern: $VAR = Exec
  severity: WARNING
  tags:
  - Command Execution
- id: sso.go.command_execution.syscall.0002.no-syscall.ForkExec
