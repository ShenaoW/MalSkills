rules:
- id: no-Cmd.CombinedOutput
  languages:
  - go
  message: Avoid using Cmd.CombinedOutput(), as it can lead to potential issues with command execution.
  metadata:
    api: Cmd.CombinedOutput()
    category: Command Execution
  pattern-either:
  - pattern: Cmd.CombinedOutput(...)
  - pattern: $VAR = Cmd.CombinedOutput
  severity: WARNING
  tags:
  - Command Execution
