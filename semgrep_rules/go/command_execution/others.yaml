rules:
- id: sso.go.command_execution.others.0001.no-os.StartProcess
  languages:
  - go
  message: Avoid using os.StartProcess(), as it can lead to potential issues with command execution.
  metadata:
    api: os.StartProcess()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: os.StartProcess(...)
  - pattern: $VAR = os.StartProcess
  severity: WARNING
  tags:
  - Command Execution
