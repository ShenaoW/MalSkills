  - pattern: $VAR = websocket.Dial
  severity: WARNING
  tags:
  - Network Access
- id: no-websocket.Upgrader.Upgrade
  languages:
  - go
  message: Avoid using websocket.Upgrader.Upgrade(), as it can lead to potential issues with network access.
