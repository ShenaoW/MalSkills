rules:
- id: no-websocket.DefaultDialer.Dial
  languages:
  - go
  message: Avoid using websocket.DefaultDialer.Dial(), as it can lead to potential issues with network access.
  metadata:
    api: websocket.DefaultDialer.Dial()
    category: Network Access
  pattern-either:
  - pattern: websocket.DefaultDialer.Dial(...)
  - pattern: $VAR = websocket.DefaultDialer.Dial
  - pattern: DefaultDialer.Dial(...)
  - pattern: $VAR = DefaultDialer.Dial
  severity: WARNING
  tags:
  - Network Access
- id: no-websocket.Dial
  languages:
  - go
