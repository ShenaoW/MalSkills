rules:
- id: sso.go.network_access.net.0001.no-net.Dial
  languages:
  - go
  message: Avoid using net.Dial(), as it can lead to potential issues with network access.
  metadata:
    api: net.Dial()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: net.Dial(...)
  - pattern: $VAR = net.Dial
  severity: WARNING
  tags:
  - Network Access
