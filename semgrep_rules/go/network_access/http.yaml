rules:
- id: no-http.Client.Do
  languages:
  - go
  message: Avoid using http.Client.Do(), as it can lead to potential issues with network access.
  metadata:
    api: http.Client.Do()
    category: Network Access
  pattern-either:
  - pattern: http.Client.Do(...)
  - pattern: $VAR = http.Client.Do
  - pattern: Client.Do(...)
  - pattern: $VAR = Client.Do
  severity: WARNING
  tags:
  - Network Access
