rules:
- id: no-otto.New
  languages:
  - go
  message: Avoid using otto.New(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: otto.New()
    category: Dynamic Execution
  pattern-either:
  - pattern: otto.New(...)
  - pattern: $VAR = otto.New
  severity: WARNING
  tags:
  - Dynamic Execution
- id: no-otto.Run
  languages:
  - go
  message: Avoid using otto.Run(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: otto.Run()
    category: Dynamic Execution
  pattern-either:
  - pattern: otto.Run(...)
  - pattern: $VAR = otto.Run
  severity: WARNING
  tags:
  - Dynamic Execution
