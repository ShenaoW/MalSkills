rules:
- id: sso.go.dynamic_execution.expr.0001.no-expr.Compile
  languages:
  - go
  message: Avoid using expr.Compile(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: expr.Compile()
    category: Dynamic Execution
    malskills_sso_category: payload_execution
    malskills_subtype: dynamic_code_execution
  pattern-either:
  - pattern: expr.Compile(...)
  - pattern: $VAR = expr.Compile
  severity: WARNING
  tags:
  - Dynamic Execution
- id: sso.go.dynamic_execution.expr.0002.no-expr.Run
  languages:
  - go
  message: Avoid using expr.Run(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: expr.Run()
    category: Dynamic Execution
    malskills_sso_category: payload_execution
    malskills_subtype: dynamic_code_execution
  pattern-either:
  - pattern: expr.Run(...)
  - pattern: $VAR = expr.Run
  severity: WARNING
  tags:
  - Dynamic Execution
