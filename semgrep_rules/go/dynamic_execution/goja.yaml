rules:
- id: no-goja.New
  languages:
  - go
  message: Avoid using goja.New(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: goja.New()
    category: Dynamic Execution
  pattern-either:
  - pattern: goja.New(...)
  - pattern: $VAR = goja.New
  severity: WARNING
  tags:
  - Dynamic Execution
- id: no-goja.Runtime.RunString
  languages:
  - go
  message: Avoid using goja.Runtime.RunString(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: goja.Runtime.RunString()
    category: Dynamic Execution
  pattern-either:
  - pattern: goja.Runtime.RunString(...)
  - pattern: $VAR = goja.Runtime.RunString
  - pattern: Runtime.RunString(...)
  - pattern: $VAR = Runtime.RunString
  severity: WARNING
  tags:
  - Dynamic Execution
