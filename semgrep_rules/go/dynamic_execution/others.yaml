rules:
- id: no-plugin.Open
  languages:
  - go
  message: Avoid using plugin.Open(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: plugin.Open()
    category: Dynamic Execution
  pattern-either:
  - pattern: plugin.Open(...)
  - pattern: $VAR = plugin.Open
  severity: WARNING
  tags:
  - Dynamic Execution
