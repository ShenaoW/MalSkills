rules:
- id: sso.go.obfuscation.exec.0001.no-exec.Command_x__x_.Output
  languages:
  - go
  message: Avoid using exec.Command().Output(), as it can lead to potential issues with obfuscation.
  metadata:
    api: exec.Command().Output()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: encoding
  pattern-either:
  - pattern: exec.Command().Output(...)
  - pattern: $VAR = exec.Command().Output
  - pattern: Command().Output(...)
  - pattern: $VAR = Command().Output
  severity: WARNING
  tags:
  - Obfuscation
