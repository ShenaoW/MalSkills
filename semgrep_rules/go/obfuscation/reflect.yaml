rules:
- id: no-reflect.TypeOf
  languages:
  - go
  message: Avoid using reflect.TypeOf(), as it can lead to potential issues with obfuscation.
  metadata:
    api: reflect.TypeOf()
    category: Obfuscation
  pattern-either:
  - pattern: reflect.TypeOf(...)
  - pattern: $VAR = reflect.TypeOf
  severity: WARNING
  tags:
  - Obfuscation
- id: no-reflect.Value.Call
