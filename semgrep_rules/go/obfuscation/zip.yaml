rules:
- id: sso.go.obfuscation.zip.0001.no-zip.NewReader
  languages:
  - go
  message: Avoid using zip.NewReader(), as it can lead to potential issues with obfuscation.
  metadata:
    api: zip.NewReader()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: encoding
  pattern-either:
  - pattern: zip.NewReader(...)
  - pattern: $VAR = zip.NewReader
  severity: WARNING
  tags:
  - Obfuscation
