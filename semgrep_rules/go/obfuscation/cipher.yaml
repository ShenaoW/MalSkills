rules:
- id: no-cipher.NewCBCEncrypter
  languages:
  - go
  message: Avoid using cipher.NewCBCEncrypter(), as it can lead to potential issues with obfuscation.
  metadata:
    api: cipher.NewCBCEncrypter()
    category: Obfuscation
  pattern-either:
  - pattern: cipher.NewCBCEncrypter(...)
  - pattern: $VAR = cipher.NewCBCEncrypter
  severity: WARNING
  tags:
  - Obfuscation
