rules:
- id: sso.go.obfuscation.others.0001.no-aes.NewCipher
  languages:
  - go
  message: Avoid using aes.NewCipher(), as it can lead to potential issues with obfuscation.
  metadata:
    api: aes.NewCipher()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: encryption
  pattern-either:
  - pattern: aes.NewCipher(...)
  - pattern: $VAR = aes.NewCipher
  severity: WARNING
  tags:
  - Obfuscation
