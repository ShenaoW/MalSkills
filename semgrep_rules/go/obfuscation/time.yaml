rules:
- id: sso.go.obfuscation.time.0001.no-time.AfterFunc
  languages:
  - go
  message: Avoid using time.AfterFunc(), as it can lead to potential issues with obfuscation.
  metadata:
    api: time.AfterFunc()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: encoding
  pattern-either:
  - pattern: time.AfterFunc(...)
  - pattern: $VAR = time.AfterFunc
  severity: WARNING
  tags:
  - Obfuscation
