rules:
- id: sso.go.obfuscation.json.0001.no-json.Marshal
  languages:
  - go
  message: Avoid using json.Marshal(), as it can lead to potential issues with obfuscation.
  metadata:
    api: json.Marshal()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: encoding
  pattern-either:
  - pattern: json.Marshal(...)
  - pattern: $VAR = json.Marshal
  severity: WARNING
  tags:
  - Obfuscation
- id: sso.go.obfuscation.json.0002.no-json.Unmarshal
  languages:
  - go
  message: Avoid using json.Unmarshal(), as it can lead to potential issues with obfuscation.
  metadata:
    api: json.Unmarshal()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: decoding
  pattern-either:
  - pattern: json.Unmarshal(...)
  - pattern: $VAR = json.Unmarshal
  severity: WARNING
  tags:
  - Obfuscation
