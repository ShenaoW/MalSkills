rules:
- id: no-dlclose
  languages:
  - c
  message: Avoid using dlclose(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: dlclose()
    category: Dynamic Execution
  pattern-either:
  - pattern: dlclose(...)
  - pattern: $VAR = dlclose
  severity: WARNING
  tags:
  - Dynamic Execution
