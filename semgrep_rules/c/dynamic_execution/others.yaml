rules:
- id: sso.c.dynamic_execution.others.0001.no-dlclose
  languages:
  - c
  message: Avoid using dlclose(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: dlclose()
    category: Dynamic Execution
    malskills_sso_category: payload_execution
    malskills_subtype: dynamic_code_execution
  pattern-either:
  - pattern: dlclose(...)
  - pattern: $VAR = dlclose
  severity: WARNING
  tags:
  - Dynamic Execution
