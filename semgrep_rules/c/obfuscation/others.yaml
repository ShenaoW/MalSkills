rules:
- id: sso.c.obfuscation.others.0001.no-aes_decrypt
  languages:
  - c
  message: Avoid using aes_decrypt(), as it can lead to potential issues with obfuscation.
  metadata:
    api: aes_decrypt()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: decryption
  pattern-either:
  - pattern: aes_decrypt(...)
  - pattern: $VAR = aes_decrypt
  severity: WARNING
  tags:
  - Obfuscation
