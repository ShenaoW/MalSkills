rules:
- id: no-execl
  languages:
  - c
  message: Avoid using execl(), as it can lead to potential issues with command execution.
  metadata:
    api: execl()
    category: Command Execution
  pattern-either:
  - pattern: execl(...)
  - pattern: $VAR = execl
  severity: WARNING
  tags:
  - Command Execution
