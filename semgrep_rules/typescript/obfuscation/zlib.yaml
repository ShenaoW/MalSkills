rules:
- id: no-zlib-BrotliCompress
  languages:
  - typescript
  message: Avoid using zlib.BrotliCompress(), as it can lead to potential issues with obfuscation.
  metadata:
    api: zlib.BrotliCompress()
    category: Obfuscation
  pattern-either:
  - pattern: zlib.BrotliCompress(...)
  - pattern: $VAR = zlib.BrotliCompress
  severity: WARNING
  tags:
  - Obfuscation
