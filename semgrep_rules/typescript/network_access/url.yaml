rules:
- id: no-url-URL
  languages:
  - typescript
  message: Avoid using url.URL(), as it can lead to potential issues with network access.
  metadata:
    api: url.URL()
    category: Network Access
  pattern-either:
  - pattern: url.URL(...)
  - pattern: $VAR = url.URL
  severity: WARNING
  tags:
  - Network Access
