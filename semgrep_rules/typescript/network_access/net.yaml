rules:
- id: sso.typescript.network_access.net.0001.no-net-BlockList
  languages:
  - typescript
  message: Avoid using net.BlockList(), as it can lead to potential issues with network access.
  metadata:
    api: net.BlockList()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: net.BlockList(...)
  - pattern: $VAR = net.BlockList
  severity: WARNING
  tags:
  - Network Access
