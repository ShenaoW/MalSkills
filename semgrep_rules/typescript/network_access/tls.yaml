rules:
- id: sso.typescript.network_access.tls.0001.no-tls-SecureContext
  languages:
  - typescript
  message: Avoid using tls.SecureContext(), as it can lead to potential issues with network access.
  metadata:
    api: tls.SecureContext()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: tls.SecureContext(...)
  - pattern: $VAR = tls.SecureContext
  severity: WARNING
  tags:
  - Network Access
