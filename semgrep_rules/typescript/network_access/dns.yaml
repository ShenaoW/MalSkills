rules:
- id: no-dns-Resolver
  languages:
  - typescript
  message: Avoid using dns.Resolver(), as it can lead to potential issues with network access.
  metadata:
    api: dns.Resolver()
    category: Network Access
  pattern-either:
  - pattern: dns.Resolver(...)
  - pattern: $VAR = dns.Resolver
  severity: WARNING
  tags:
  - Network Access
