rules:
- id: sso.java.command_execution.others.0001.no-Process
  languages:
  - java
  message: Avoid using Process(), as it can lead to potential issues with command execution.
  metadata:
    api: Process()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: new Process(...)
  - pattern: Process(...)
  - pattern: $VAR = Process
  severity: WARNING
  tags:
  - Command Execution
