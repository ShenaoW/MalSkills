rules:
- id: no-java-lang-Class-forName
  languages:
  - java
  message: Avoid using java.lang.Class.forName(), as it can lead to potential issues with command execution.
  metadata:
    api: java.lang.Class.forName()
    category: Command Execution
  pattern-either:
  - pattern: new java.lang.Class.forName(...)
  - pattern: java.lang.Class.forName(...)
  - pattern: $VAR = java.lang.Class.forName
  - pattern: new lang.Class.forName(...)
  - pattern: lang.Class.forName(...)
  - pattern: $VAR = lang.Class.forName
  - pattern: new Class.forName(...)
  - pattern: Class.forName(...)
  - pattern: $VAR = Class.forName
  severity: WARNING
  tags:
  - Command Execution
