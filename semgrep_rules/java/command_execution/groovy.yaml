rules:
- id: sso.java.command_execution.groovy.0001.no-groovy-lang-GroovyShell-evaluate
  languages:
  - java
  message: Avoid using groovy.lang.GroovyShell.evaluate(), as it can lead to potential issues with command execution.
  metadata:
    api: groovy.lang.GroovyShell.evaluate()
    category: Command Execution
    malskills_sso_category: payload_execution
    malskills_subtype: system_command_execution
  pattern-either:
  - pattern: new groovy.lang.GroovyShell.evaluate(...)
  - pattern: groovy.lang.GroovyShell.evaluate(...)
  - pattern: $VAR = groovy.lang.GroovyShell.evaluate
  - pattern: new lang.GroovyShell.evaluate(...)
  - pattern: lang.GroovyShell.evaluate(...)
  - pattern: $VAR = lang.GroovyShell.evaluate
  - pattern: new GroovyShell.evaluate(...)
  - pattern: GroovyShell.evaluate(...)
  - pattern: $VAR = GroovyShell.evaluate
  severity: WARNING
  tags:
  - Command Execution
