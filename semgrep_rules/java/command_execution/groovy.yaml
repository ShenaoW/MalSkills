  - pattern: new lang.GroovyShell.parse(...)
  - pattern: lang.GroovyShell.parse(...)
  - pattern: $VAR = lang.GroovyShell.parse
  - pattern: new GroovyShell.parse(...)
  - pattern: GroovyShell.parse(...)
  - pattern: $VAR = GroovyShell.parse
