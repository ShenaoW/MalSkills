rules:
- id: no-java-lang-Class-newInstance
  languages:
  - java
  message: Avoid using java.lang.Class.newInstance(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: java.lang.Class.newInstance()
    category: Dynamic Execution
  pattern-either:
  - pattern: new java.lang.Class.newInstance(...)
  - pattern: java.lang.Class.newInstance(...)
  - pattern: $VAR = java.lang.Class.newInstance
  - pattern: new lang.Class.newInstance(...)
  - pattern: lang.Class.newInstance(...)
  - pattern: $VAR = lang.Class.newInstance
  - pattern: new Class.newInstance(...)
  - pattern: Class.newInstance(...)
  - pattern: $VAR = Class.newInstance
  severity: WARNING
  tags:
  - Dynamic Execution
