  - pattern: lang.ClassLoader.loadClass(...)
  - pattern: $VAR = lang.ClassLoader.loadClass
  - pattern: new ClassLoader.loadClass(...)
  - pattern: ClassLoader.loadClass(...)
  - pattern: $VAR = ClassLoader.loadClass
