rules:
- id: sso.java.dynamic_execution.javassist.0001.no-javassist-ClassPool-get
  languages:
  - java
  message: Avoid using javassist.ClassPool.get(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: javassist.ClassPool.get()
    category: Dynamic Execution
    malskills_sso_category: payload_execution
    malskills_subtype: dynamic_code_execution
  pattern-either:
  - pattern: new javassist.ClassPool.get(...)
  - pattern: javassist.ClassPool.get(...)
  - pattern: $VAR = javassist.ClassPool.get
  - pattern: new ClassPool.get(...)
  - pattern: ClassPool.get(...)
  - pattern: $VAR = ClassPool.get
  severity: WARNING
  tags:
  - Dynamic Execution
