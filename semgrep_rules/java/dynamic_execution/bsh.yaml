rules:
- id: no-bsh-Interpreter-eval
  languages:
  - java
  message: Avoid using bsh.Interpreter.eval(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: bsh.Interpreter.eval()
    category: Dynamic Execution
  pattern-either:
  - pattern: new bsh.Interpreter.eval(...)
  - pattern: bsh.Interpreter.eval(...)
  - pattern: $VAR = bsh.Interpreter.eval
  - pattern: new Interpreter.eval(...)
  - pattern: Interpreter.eval(...)
  - pattern: $VAR = Interpreter.eval
  severity: WARNING
  tags:
  - Dynamic Execution
