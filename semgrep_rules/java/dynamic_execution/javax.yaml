rules:
- id: no-javax-tools-JavaCompiler-getTask
  languages:
  - java
  message: Avoid using javax.tools.JavaCompiler.getTask(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: javax.tools.JavaCompiler.getTask()
    category: Dynamic Execution
  pattern-either:
  - pattern: new javax.tools.JavaCompiler.getTask(...)
  - pattern: javax.tools.JavaCompiler.getTask(...)
  - pattern: $VAR = javax.tools.JavaCompiler.getTask
  - pattern: new tools.JavaCompiler.getTask(...)
  - pattern: tools.JavaCompiler.getTask(...)
  - pattern: $VAR = tools.JavaCompiler.getTask
  - pattern: new JavaCompiler.getTask(...)
  - pattern: JavaCompiler.getTask(...)
  - pattern: $VAR = JavaCompiler.getTask
  severity: WARNING
  tags:
  - Dynamic Execution
