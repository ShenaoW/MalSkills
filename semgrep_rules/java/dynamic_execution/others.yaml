rules:
- id: no-groovy-lang-Script-run
  languages:
  - java
  message: Avoid using groovy.lang.Script.run(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: groovy.lang.Script.run()
    category: Dynamic Execution
  pattern-either:
  - pattern: new groovy.lang.Script.run(...)
  - pattern: groovy.lang.Script.run(...)
  - pattern: $VAR = groovy.lang.Script.run
  - pattern: new lang.Script.run(...)
  - pattern: lang.Script.run(...)
  - pattern: $VAR = lang.Script.run
  - pattern: new Script.run(...)
  - pattern: Script.run(...)
  - pattern: $VAR = Script.run
  severity: WARNING
  tags:
  - Dynamic Execution
