- id: sso.java.cryptography.java.0001.no-java-security-KeyFactory-generatePrivate
  languages:
  - java
  message: Avoid using java.security.KeyFactory.generatePrivate(), as it can lead to potential issues with cryptography.
  metadata:
    api: java.security.KeyFactory.generatePrivate()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: cipher_object_creation
  pattern-either:
  - pattern: new java.security.KeyFactory.generatePrivate(...)
  - pattern: java.security.KeyFactory.generatePrivate(...)
  - pattern: $VAR = java.security.KeyFactory.generatePrivate
  - pattern: new security.KeyFactory.generatePrivate(...)
  - pattern: security.KeyFactory.generatePrivate(...)
  - pattern: $VAR = security.KeyFactory.generatePrivate
  - pattern: new KeyFactory.generatePrivate(...)
  - pattern: KeyFactory.generatePrivate(...)
  - pattern: $VAR = KeyFactory.generatePrivate
  severity: WARNING
  tags:
  - Cryptography
