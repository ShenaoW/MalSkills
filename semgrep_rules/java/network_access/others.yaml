rules:
- id: sso.java.network_access.others.0001.no-HttpClient
  languages:
  - java
  message: Avoid using HttpClient(), as it can lead to potential issues with network access.
  metadata:
    api: HttpClient()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: new HttpClient(...)
  - pattern: HttpClient(...)
  - pattern: $VAR = HttpClient
  severity: WARNING
  tags:
  - Network Access
