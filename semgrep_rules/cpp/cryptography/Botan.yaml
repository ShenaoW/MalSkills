rules:
- id: sso.cpp.cryptography.Botan.0001.no-Botan-AES_128-decrypt
  languages:
  - cpp
  message: Avoid using Botan::AES_128::decrypt(), as it can lead to potential issues with cryptography.
  metadata:
    api: Botan::AES_128::decrypt()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: decryption
  pattern-either:
  - pattern: Botan::AES_128::decrypt(...)
  - pattern: $VAR = Botan::AES_128::decrypt
  - pattern: AES_128::decrypt(...)
  - pattern: $VAR = AES_128::decrypt
  severity: WARNING
  tags:
  - Cryptography
