rules:
- id: sso.cpp.network_access.boost.0001.no-boost-asio-ip-tcp-acceptor-accept
  languages:
  - cpp
  message: Avoid using boost::asio::ip::tcp::acceptor::accept(), as it can lead to potential issues with network access.
  metadata:
    api: boost::asio::ip::tcp::acceptor::accept()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: server_listen
  pattern-either:
  - pattern: boost::asio::ip::tcp::acceptor::accept(...)
  - pattern: $VAR = boost::asio::ip::tcp::acceptor::accept
  - pattern: asio::ip::tcp::acceptor::accept(...)
  - pattern: $VAR = asio::ip::tcp::acceptor::accept
  - pattern: ip::tcp::acceptor::accept(...)
  - pattern: $VAR = ip::tcp::acceptor::accept
  - pattern: tcp::acceptor::accept(...)
  - pattern: $VAR = tcp::acceptor::accept
  - pattern: acceptor::accept(...)
  - pattern: $VAR = acceptor::accept
  severity: WARNING
  tags:
  - Network Access
