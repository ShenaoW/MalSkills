rules:
- id: no-std-filesystem-copy
  languages:
  - cpp
  message: Avoid using std::filesystem::copy(), as it can lead to potential issues with file or system operation.
  metadata:
    api: std::filesystem::copy()
    category: File or System Operation
  pattern-either:
  - pattern: std::filesystem::copy(...)
  - pattern: $VAR = std::filesystem::copy
  - pattern: filesystem::copy(...)
  - pattern: $VAR = filesystem::copy
  severity: WARNING
  tags:
  - File or System Operation
