rules:
- id: no-ofstream-close
  languages:
  - cpp
  message: Avoid using ofstream::close(), as it can lead to potential issues with file or system operation.
  metadata:
    api: ofstream::close()
    category: File or System Operation
  pattern-either:
  - pattern: ofstream::close(...)
  - pattern: $VAR = ofstream::close
  severity: WARNING
  tags:
  - File or System Operation
- id: no-ofstream-open
  languages:
  - cpp
  message: Avoid using ofstream::open(), as it can lead to potential issues with file or system operation.
  metadata:
    api: ofstream::open()
    category: File or System Operation
  pattern-either:
  - pattern: ofstream::open(...)
  - pattern: $VAR = ofstream::open
  severity: WARNING
  tags:
  - File or System Operation
- id: no-ofstream-write
  languages:
  - cpp
  message: Avoid using ofstream::write(), as it can lead to potential issues with file or system operation.
  metadata:
    api: ofstream::write()
    category: File or System Operation
  pattern-either:
  - pattern: ofstream::write(...)
  - pattern: $VAR = ofstream::write
  severity: WARNING
  tags:
  - File or System Operation
