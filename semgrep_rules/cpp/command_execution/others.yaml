rules:
- id: no-CreateProcess
  languages:
  - cpp
  message: Avoid using CreateProcess(), as it can lead to potential issues with command execution.
  metadata:
    api: CreateProcess()
    category: Command Execution
  pattern-either:
  - pattern: CreateProcess(...)
  - pattern: $VAR = CreateProcess
  severity: WARNING
  tags:
  - Command Execution
