rules:
- id: no-CryptoPP-AES-Decryption
  languages:
  - cpp
  message: Avoid using CryptoPP::AES::Decryption(), as it can lead to potential issues with obfuscation.
  metadata:
    api: CryptoPP::AES::Decryption()
    category: Obfuscation
  pattern-either:
  - pattern: CryptoPP::AES::Decryption(...)
  - pattern: $VAR = CryptoPP::AES::Decryption
  - pattern: AES::Decryption(...)
  - pattern: $VAR = AES::Decryption
  severity: WARNING
  tags:
  - Obfuscation
