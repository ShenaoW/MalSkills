rules:
- id: sso.cpp.obfuscation.std.0001.no-std-bind
  languages:
  - cpp
  message: Avoid using std::bind(), as it can lead to potential issues with obfuscation.
  metadata:
    api: std::bind()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: encoding
  pattern-either:
  - pattern: std::bind(...)
  - pattern: $VAR = std::bind
  severity: WARNING
  tags:
  - Obfuscation
