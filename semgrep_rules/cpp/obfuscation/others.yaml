rules:
- id: sso.cpp.obfuscation.others.0001.no-CheckRemoteDebuggerPresent
  languages:
  - cpp
  message: Avoid using CheckRemoteDebuggerPresent(), as it can lead to potential issues with obfuscation.
  metadata:
    api: CheckRemoteDebuggerPresent()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: encoding
  pattern-either:
  - pattern: CheckRemoteDebuggerPresent(...)
  - pattern: $VAR = CheckRemoteDebuggerPresent
  severity: WARNING
  tags:
  - Obfuscation
