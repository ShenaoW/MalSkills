rules:
- id: no-CallWindowProc
  languages:
  - cpp
  message: Avoid using CallWindowProc(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: CallWindowProc()
    category: Dynamic Execution
  pattern-either:
  - pattern: CallWindowProc(...)
  - pattern: $VAR = CallWindowProc
  severity: WARNING
  tags:
  - Dynamic Execution
