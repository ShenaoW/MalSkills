rules:
- id: no-asmjit-CodeHolder-finalize
  languages:
  - cpp
  message: Avoid using asmjit::CodeHolder::finalize(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: asmjit::CodeHolder::finalize()
    category: Dynamic Execution
  pattern-either:
  - pattern: asmjit::CodeHolder::finalize(...)
  - pattern: $VAR = asmjit::CodeHolder::finalize
  - pattern: CodeHolder::finalize(...)
  - pattern: $VAR = CodeHolder::finalize
  severity: WARNING
  tags:
  - Dynamic Execution
- id: no-asmjit-JitRuntime-add
  languages:
  - cpp
  message: Avoid using asmjit::JitRuntime::add(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: asmjit::JitRuntime::add()
    category: Dynamic Execution
  pattern-either:
  - pattern: asmjit::JitRuntime::add(...)
  - pattern: $VAR = asmjit::JitRuntime::add
  - pattern: JitRuntime::add(...)
  - pattern: $VAR = JitRuntime::add
  severity: WARNING
  tags:
  - Dynamic Execution
