rules:
- id: no-chgrp
  languages:
  - php
  message: Avoid using chgrp(), as it can lead to potential issues with file or system operation.
  metadata:
    api: chgrp()
    category: File or System Operation
  pattern-either:
  - pattern: chgrp(...)
  - pattern: $VAR = chgrp(...)
  - pattern: $VAR = "chgrp"
  - pattern: $VAR = 'chgrp'
  severity: WARNING
  tags:
  - File or System Operation
