rules:
- id: sso.php.obfuscation.others.0001.no-base64_decode
  languages:
  - php
  message: Avoid using base64_decode(), as it can lead to potential issues with obfuscation.
  metadata:
    api: base64_decode()
    category: Obfuscation
    malskills_sso_category: cryptography
    malskills_subtype: decoding
  pattern-either:
  - pattern: base64_decode(...)
  - pattern: $VAR = base64_decode(...)
  - pattern: $VAR = "base64_decode"
  - pattern: $VAR = 'base64_decode'
  severity: WARNING
  tags:
  - Obfuscation
