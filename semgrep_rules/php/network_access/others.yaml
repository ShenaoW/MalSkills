rules:
- id: sso.php.network_access.others.0001.no-curl_close
  languages:
  - php
  message: Avoid using curl_close(), as it can lead to potential issues with network access.
  metadata:
    api: curl_close()
    category: Network Access
    malskills_sso_category: network_access
    malskills_subtype: connection_create
  pattern-either:
  - pattern: curl_close(...)
  - pattern: $VAR = curl_close(...)
  - pattern: $VAR = "curl_close"
  - pattern: $VAR = 'curl_close'
  severity: WARNING
  tags:
  - Network Access
