rules:
- id: no-chroot
  languages:
  - php
  message: Avoid using chroot(), as it can lead to potential issues with command execution.
  metadata:
    api: chroot()
    category: Command Execution
  pattern-either:
  - pattern: chroot(...)
  - pattern: $VAR = chroot(...)
  - pattern: $VAR = "chroot"
  - pattern: $VAR = 'chroot'
  severity: WARNING
  tags:
  - Command Execution
