rules:
- id: sso.php.cryptography.others.0001.no-crypt
  languages:
  - php
  message: Avoid using crypt(), as it can lead to potential issues with cryptography.
  metadata:
    api: crypt()
    category: Cryptography
    malskills_sso_category: cryptography
    malskills_subtype: cryptographic_operation
  pattern-either:
  - pattern: crypt(...)
  - pattern: $VAR = crypt(...)
  - pattern: $VAR = "crypt"
  - pattern: $VAR = 'crypt'
  severity: WARNING
  tags:
  - Cryptography
