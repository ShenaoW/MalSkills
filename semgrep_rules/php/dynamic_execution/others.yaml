rules:
- id: sso.php.dynamic_execution.others.0001.no-eval
  languages:
  - php
  message: Avoid using eval(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: eval()
    category: Dynamic Execution
    malskills_sso_category: payload_execution
    malskills_subtype: dynamic_code_execution
  pattern-either:
  - pattern: eval(...)
  - pattern: $VAR = eval(...)
  - pattern: $VAR = "eval"
  - pattern: $VAR = 'eval'
  severity: WARNING
  tags:
  - Dynamic Execution
