rules:
- id: no-eval
  languages:
  - php
  message: Avoid using eval(), as it can lead to potential issues with dynamic code execution.
  metadata:
    api: eval()
    category: Dynamic Execution
  pattern-either:
  - pattern: eval(...)
  - pattern: $VAR = eval(...)
  - pattern: $VAR = "eval"
  - pattern: $VAR = 'eval'
  severity: WARNING
  tags:
  - Dynamic Execution
